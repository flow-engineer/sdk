# Every claim the comparison pages (docs/compare/*.mdx) make about another product.
#
# Rules:
# - A claim comes from the product's OWN current docs, pricing page or repository,
#   never from a third party or another vendor's "vs" page. `claim` paraphrases or
#   quotes it; `quote` holds the source's own words where they matter.
# - `checked` is the date someone last opened `source` and saw the claim still true.
#   scripts/check-compare.sh fails when it is older than 90 days: re-verify, update
#   the claim and the page (and its "Last verified" line), then the date.
# - `pages` lists the pages (paths under docs/, no extension) that use the claim.
#   Each page marks the spot with {/* claim: <id> */} and links `source`.
# - Keep this file in the small YAML subset the check script reads: each entry starts
#   with "- id:", then one "  key: value" per line; `pages` is a flow list.
# - Never name the provider behind Flow's own iMessage line here or on the pages.

# --- Photon (Spectrum, spectrum-ts) ---

