# --- Telegram Bot API ---

- id: telegram.free
  claim: The Telegram Bot Platform is free for users and developers.
  quote: "free for both users and developers"
  source: https://core.telegram.org/bots
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

- id: telegram.no-first-message
  claim: Telegram bots cannot start conversations; the user must message the bot or add it to a group first.
  quote: "Bots can't start conversations with users. A user must either add them to a group or send them a message first."
  source: https://core.telegram.org/bots
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

- id: telegram.updates
  claim: Updates come by getUpdates or by webhook (mutually exclusive) and are kept on Telegram's servers for at most 24 hours.
  quote: "they will not be kept longer than 24 hours"
  source: https://core.telegram.org/bots/api#getting-updates
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

- id: telegram.webhook-retries
  claim: Telegram retries a failed webhook request and gives up after "a reasonable amount of attempts"; a secret_token sets the X-Telegram-Bot-Api-Secret-Token header.
  quote: "we will repeat the request and give up after a reasonable amount of attempts"
  source: https://core.telegram.org/bots/api#setwebhook
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

- id: telegram.update-id
  claim: update_id increases sequentially, so a webhook consumer can ignore repeated updates or restore the order when they arrive out of order.
  quote: "allows you to ignore repeated updates or to restore the correct update sequence, should they get out of order"
  source: https://core.telegram.org/bots/api#update
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

- id: telegram.limits
  claim: Telegram asks bots to send at most about one message per second per chat, 20 per minute in a group and about 30 per second in bulk, answering 429 with retry_after beyond that.
  quote: "In a single chat, avoid sending more than one message per second."
  source: https://core.telegram.org/bots/faq
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

- id: telegram.drafts
  claim: sendMessageDraft (Bot API 9.3, opened to all bots in 9.5) streams partial messages to a user in a private chat while they are generated.
  quote: "allowing partial messages to be streamed to a user while being generated"
  source: https://core.telegram.org/bots/api-changelog
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

- id: telegram.sendmessage
  claim: A bot replies with sendMessage (chat_id and text) at https://api.telegram.org/bot<token>/sendMessage.
  source: https://core.telegram.org/bots/api#sendmessage
  checked: 2026-10-10
  pages: [compare/choosing-a-messaging-api]

