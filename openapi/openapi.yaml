openapi: 3.1.0
info:
  title: Flow Messaging API
  version: "2026-11-01"
  summary: Two-way messaging for AI agents on WhatsApp, Telegram and iMessage.
  description: |
    Flow Messaging lets an AI agent hold conversations with people on **WhatsApp**,
    **Telegram** and **iMessage** through one HTTP API, and on **SMS and MMS in the
    US** (in pilot: dedicated numbers arranged with the Flow team). Flow hosts the
    senders (bots, numbers and lines), receives every inbound message, and passes
    every send through one gate that enforces each channel's rules. You never handle
    vendor keys or channel webhooks.

    Channels today: Telegram is live. iMessage is live for replies only, on lines the
    Flow team connects to your app. WhatsApp numbers are connected by the Flow team
    too, either a number Flow provides or one in your business's own WhatsApp
    Business Account, and the WhatsApp-only parts (templates, the 24-hour window)
    apply on them; the shared WhatsApp sandbox is not open yet.

    This API is in **beta**: the shape may still change before it is declared stable.
    Changes are released as new dated versions (see Versioning).

    ## Concepts

    - An **app** is one agent integration. It owns API keys, webhook endpoints and
      settings, and has a test mode and a live mode.
    - A **sender** is what your agent talks *from*: a Telegram bot, a WhatsApp number,
      an iMessage line or a US SMS number. Shared sandbox senders serve many apps; dedicated senders
      are yours alone.
    - A **contact** is a person on one channel. There is no cross-channel identity: a
      contact on Telegram and a contact on WhatsApp are different contacts, even if
      they are the same person. Never assume a contact has a phone number.
    - A **conversation** is one sender talking with one contact. You reply into a
      conversation; you never pick a channel per message.
    - A **message** carries one piece of typed **content** (text, media, voice,
      buttons, a reaction, a template, ...). The same content union is used in both
      directions.
    - An **event** is one entry in your app's ordered log. Everything you receive
      (inbound messages, delivery statuses, reactions, sender changes) is an event,
      delivered by webhook, by the live stream (`GET /v1/stream`) and by polling
      (`GET /v1/events`).

    ## Authentication

    Every request carries an API key as a bearer token:

    ```
    Authorization: Bearer fk_live_...
    ```

    Keys belong to one app and one mode. `fk_test_` keys see only sandbox senders and
    test data, and nothing they send reaches a real contact unless that contact joined
    the sandbox. `fk_live_` keys reach real contacts through your dedicated senders.
    A key is shown once when it is created and stored only as a hash. Keys are never
    accepted in the query string. The live stream (`GET /v1/stream`) also takes the
    key as a WebSocket subprotocol, for browsers, which cannot set headers on a
    WebSocket (see that endpoint).

    ### No key yet? Get one in one call

    Anyone, including an AI coding agent, can get a test key without signing up:

    ```
    curl -X POST https://api.flow.engineer/v1/sandbox/keys
    ```

    The answer (`SandboxKey`) holds a `fk_test_` key for a new app of its own, shown
    once, and the sandbox senders with the links and join code a person uses to
    join it. Save the key (for example as `FLOW_MESSAGING_KEY`) and the
    `claim_token`. This key needs no account and has a **sandbox allowance**: 1
    contact and 50 messages sent in total on the Telegram sandbox (and WhatsApp's
    when it opens), and it **expires after 7 days**. Only messages your agent sends count; inbound
    messages are free. iMessage is not part of the allowance.

    To keep the app, a person signs in with a Flow account (flow.engineer)
    through the device flow: the agent or the CLI (`npx @flow-engineer/messaging login`) calls `POST
    /v1/device/authorizations` with the `claim_token`, shows the person the
    `verification_uri` and `user_code` (they type the code on that page), and polls `POST /v1/device/token`
    until it returns a key. The app is claimed: its data and keys are kept, its
    keys no longer expire, and it moves under the person's signed-in allowance of
    3 contacts and 100 messages each, **one allowance per person, shared by every
    app they own or claim** (a person may claim up to 10 apps). `GET /v1/app` shows what is left of the allowance
    (`allowance`). When it runs out, sends answer `403 permission` with
    `channel_code` `sandbox_allowance_used`.

    ## Versioning

    The API is versioned by date. Send `Flow-Version: 2026-11-01` to choose a version;
    without the header, the version pinned to your app when it was created is used.
    Responses echo the version that served them in `Flow-Version`.

    ## Idempotency

    Every `POST` that takes an API key accepts an `Idempotency-Key` header (any
    unique string up to 255 characters; a UUID or ULID is a good choice); the
    onboarding calls `POST /v1/sandbox/keys`, `POST /v1/device/authorizations` and
    `POST /v1/device/token` ignore it. Keys are kept for 24 hours per app
    and mode. Repeating a request with the same key returns the first answer, with
    the header `Idempotent-Replayed: true`, and does not act twice. Otherwise a key
    already used answers `409 idempotency_conflict`, and its `channel_code` says
    which case it is:

    - `body_mismatch`: the key was used with a different method, path or body. Use a
      new key for a new request; do not retry.
    - `in_progress`: the first request with this key is still running. Wait
      `retry_after` seconds and repeat the identical request with the same key to
      get its answer.
    - `secret_not_kept`: the first request went through, but its answer carried a
      secret shown only once (creating a webhook endpoint, rotating its secret,
      connecting a WhatsApp number), so that answer was not kept.

    Answers that are worth retrying (`429`, `500`, `502`, `503`, `504`) are not
    kept, so a retry with the same key runs again.

    ## Errors

    Errors share one shape:

    ```json
    {"error": {
      "type": "outside_window",
      "message": "Last message from the contact was 31h ago; WhatsApp allows only templates now.",
      "hint": "Send a template instead: POST /v1/messages with content.type=template.",
      "doc_url": "https://api.flow.engineer/docs/errors/outside_window",
      "conversation": "conv_01JB..."}}
    ```

    `error.type` is a closed list (see the `ErrorType` schema); switch on it, not on
    the message text. Every error carries `hint`, one sentence saying what to change
    for this case, and `doc_url`, the page for its type
    (`https://api.flow.engineer/docs/errors/<type>`: what it means, why it happens, how
    to fix it, with code). Errors that can be retried carry `retry_after` in seconds.
    Coding agents can act on `hint` directly; the MCP tool `explain_error` returns
    the page for a type.

    ## Pagination

    Lists are paged with cursors. Pass `limit` (1 to 100, default 20) and either
    `after` or `before`, set to the ID of an item you already have. IDs are prefixed
    ULIDs, so they sort by creation time. The event log (`GET /v1/events`) is oldest
    first, so `after` moves forward in time; every other list is newest first, so
    `after` moves back in time. A list answer says `has_more` when more items lie in
    that direction.

    ## Rate limits

    Requests are limited per key. Every answer carries `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset`. Sends are also paced per sender by
    the send gate (see below): each sender has a sending rate it may not exceed. Going
    over either limit answers `429` with type `rate_limited`, a `Retry-After`
    header and `error.retry_after` in seconds; wait that long and retry with the
    same `Idempotency-Key`. The send gate also answers `429` with type
    `new_contact_limit` when a sender has used its budget for starting
    conversations.

    ## The send gate

    Every send (HTTP, the stream, or a reply in a webhook response) passes the same
    gate:

    - **WhatsApp**: free-form messages only while the contact's last message is less
      than 24 hours old (the window); otherwise only a `template`
      (`409 outside_window`).
    - **iMessage**: a line may only reply unless it can start conversations; a new
      conversation from a reply-only line is refused (`403 permission`). A line that
      can start conversations spends the sender's new-contact budget, and a contact
      who has never messaged the line (or opted in) gets a `message.failed` event
      with `outside_window`.
    - **Telegram**: the contact must have started the bot; Telegram enforces this.
    - **SMS (US, in pilot)**: a conversation starts only with a contact who texted
      one of your numbers before, or whose consent you record with the start
      (`consent` on `POST /v1/messages`); otherwise `403 permission` with
      `channel_code` `consent_required`. A contact who texts STOP (or STOPALL,
      UNSUBSCRIBE, CANCEL, END, QUIT, REVOKE, OPT OUT, OPTOUT) is opted out of every
      SMS sender of your app at once: sends to them answer `403 permission` with
      `channel_code` `contact_opted_out`, and messages already queued fail the same
      way, until they text START (or UNSTOP, YES) to a number they opted out
      through (carriers and providers block per number, so START to another of
      your numbers changes nothing). HELP (or INFO) gets the sender's
      help reply. Flow answers these keywords itself, and you still receive the
      message as `message.received`. The contact's `opted_out_at` shows the state.
      Messages to a contact who has not texted in the last hour respect the sender's
      quiet hours (`Sender.sms.quiet_hours`, by default 21:00 to 08:00 in the
      contact's time zone, worked out from the area code): inside them a send
      answers `409 outside_window` with `channel_code` `quiet_hours` and
      `retry_after` set to when they end; a message that waited in the queue into
      the quiet hours is held until they end, not sent at night.
    - **HIPAA accounts** (`Account.hipaa`): only channels under a business
      associate agreement carry messages (SMS). Sends, typing and read receipts on
      Telegram, WhatsApp and iMessage, and connecting senders there, answer `403
      permission` with `channel_code` `hipaa_channel_not_covered`; messages
      already queued there fail the same way. Contacts get a fixed refusal from
      the sandbox senders instead of reaching the app, and nothing they send
      there is stored or delivered. Simulated conversations (`POST
      /v1/test/conversations`) follow the same rule: only SMS can be simulated.
    - **Sandbox senders**: only contacts who joined through your app (by sending its
      join code, for example `join brave-otter-40718263`).

    Starting a conversation spends budget per sender (new contacts per day and per
    hour, with a warm-up curve for new lines) and per plan. When abuse signals trip
    (the same text to many new contacts, many starts with no reply, blocks, a drop
    in WhatsApp quality) the sender is throttled and you receive
    `sender.status_changed`: until the sender's `throttled_until`, starts fail with
    `429 sender_throttled`, while replies into existing conversations still go. The
    sender recovers by itself, with another `sender.status_changed`.

    ## Content a channel cannot show

    Nothing is converted silently. When a channel cannot show some content, the send
    fails with `422 unsupported_content`, unless the request set `fallback`: then
    the fallback is sent and the message reports what was actually shown in
    `delivered_as`. `GET /v1/capabilities` says what a conversation's channel
    supports right now.

    ## Webhooks

    Register endpoints with `POST /v1/webhook_endpoints`. Each event is `POST`ed as
    JSON (the `event` webhook below), in order per conversation, and signed:

    ```
    Flow-Signature: t=1791763200,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
    ```

    `v1` is the lowercase hex HMAC-SHA256, keyed with the endpoint's signing secret
    (`whsec_...`), of the string `t.{t}.{body}`: the letter `t`, a dot, the
    timestamp from the header, a dot, and the raw request body exactly as received.
    Compare in constant time and reject timestamps more than 5 minutes from your
    clock. While a secret is being rotated (`POST
    /v1/webhook_endpoints/{webhook_endpoint_id}/rotate_secret`), the header carries
    one `v1` per active secret; accept the request if any of them matches.

    Answer `2xx` within 10 seconds. To reply at once, answer a `message.received`
    event with `200` and a body `{"reply": <content>}` or `{"reply": [<content>, ...]}`
    (up to 10 pieces), optionally with `fallback` as on HTTP sends; the reply is sent
    into the event's conversation through the send gate, which saves a round trip.
    A string is text: `{"reply": "Hi"}` sends `{"type": "text", "text": "Hi"}`.
    Any other `2xx` answer (an empty body, plain text such as `OK`, or JSON without
    `reply`) sends nothing and is not an error. A JSON object whose `reply` is not
    valid `WebhookReply` content, or a body that starts with `{` but is not valid
    JSON, sends nothing at all and is recorded on the
    delivery as an `invalid_request` error (the MCP tool `get_webhook_deliveries`
    shows it); the delivery still counts as delivered and is not retried. Slow agents answer `200 {}` at once and send later with
    `POST /v1/conversations/{conversation_id}/messages`. Failed deliveries are retried
    with backoff for 3 days; within a conversation, later events wait behind a
    failing one. After that the event stays in the log, marked failed, and can be
    read again with `GET /v1/events`.

    Inbound messages keep the channel's order within a conversation. iMessage:
    inbound order is best-effort (arrival order); messages sent within about a second
    of each other may arrive out of order.

    ## Retention and deleting contacts

    Message content and files are kept for your plan's retention period (30 days by
    default). After it, a message's content is removed and the message is no longer
    returned, files are deleted, and events older than it leave the log.

    `DELETE /v1/contacts/{contact_id}` erases one contact at once, for example when
    the person asks you to delete their data or when you delete them in your own
    product: their name and address, the content of every message in their
    conversations, the files in them, their events and pending webhook deliveries,
    and messages still queued to them. It cannot be undone. What stays is only IDs,
    timestamps and the counts that bill and pace your senders. If the person writes
    again, or you send to their address, they are a new contact with a new ID.

    ## Testing with simulated contacts

    A test key can play the end user's side without a phone or a real channel. `POST
    /v1/test/conversations` creates a conversation on `telegram`, `whatsapp`,
    `imessage` or `sms` with a **simulated contact**; `POST /v1/test/conversations/{conversation_id}/inbound`
    writes as that contact (text, or media uploaded with `POST /v1/files`). Each turn
    reaches your agent exactly like a real message: a `message.received` event by
    webhook, on the stream and in the event log, in order. Your agent replies with
    its normal send, which passes the real send gate (content support, fallbacks,
    text limits, edit targets) and ends `sent` on your app's simulated sender,
    without touching a network. On Telegram, as with a real bot, nothing reaches a
    contact who has not written yet: a send before the contact's first turn ends
    `failed` (`channel_error`, `channel_code` `403`). `GET /v1/test/conversations/{conversation_id}/transcript`
    shows both sides, oldest first, with what the contact was shown.

    Simulated traffic is free: it does not count against the sandbox allowance,
    since nothing leaves Flow and no real person is reached. Two limits bound it
    instead: an app has at most 500 simulated conversations (a new one past that
    answers `403 permission` with `channel_code` `simulated_conversation_limit`),
    and a key makes at most 120 requests a minute to the `/v1/test/` endpoints
    (`429 rate_limited`), counted on top of its plan's request rate limit. The gate also skips the rules that protect a real number's
    standing with its channel (pacing, the new-contact budget and warm-up, abuse
    throttling), so a test suite can run cases in parallel. Simulated conversations,
    contacts and senders carry `simulated: true` (senders `kind: simulated`), exist
    only in test mode, are never shown to live keys, and follow your plan's
    retention like other test data.

    The SMS rules that concern the contact hold on a simulated SMS conversation as
    on a real number. A start or reply before the contact's first turn needs their
    recorded consent (`consent` on `POST /v1/messages`; otherwise `403 permission`
    with `channel_code` `consent_required`). A turn with the text STOP (or a
    variant) opts the simulated contact out (its `opted_out_at`, `opted_out_via`
    `keyword`; sends answer `403 permission` with `channel_code`
    `contact_opted_out`), and START to the simulated sender lifts it; the turn is
    still delivered as `message.received`, and the transcript shows no automatic
    keyword reply. A simulated SMS sender keeps no quiet hours, so a test's outcome
    never depends on the time of day, and it sends media as MMS. A HIPAA account
    (`Account.hipaa`) can simulate only SMS: creating a simulated `telegram`,
    `whatsapp` or `imessage` conversation, or posting a turn to one made before the
    flag was set, answers `403 permission` with `channel_code`
    `hipaa_channel_not_covered`.

    A simulated WhatsApp conversation keeps WhatsApp's rules. The contact's turns go
    through the same inbound path as a real WhatsApp message, so each turn opens the
    24-hour window, and the send gate applies WhatsApp's rules: outside the window
    (also before the contact's first turn) only a `template` can be sent (`409
    outside_window`); buttons go as up to 3 reply buttons, or a list for 4 to 10;
    reactions and `reply_to` work; edits and unsends answer `422
    unsupported_content`. The transcript shows what the contact would see after any
    fallback.

    ## MCP server

    `https://api.flow.engineer/mcp` is a Model Context Protocol server (Streamable
    HTTP transport, protocol version 2025-06-18 or later) for coding agents such as
    Claude Code, Codex and Cursor. It is not a REST endpoint: clients `POST`
    JSON-RPC messages to it (and `GET` answers `405`, since the server keeps no
    sessions). Authenticate with the same API key as the REST API:

    ```
    claude mcp add --transport http flow https://api.flow.engineer/mcp --header "Authorization: Bearer $FLOW_MESSAGING_KEY"
    ```

    Without a key, `/mcp` answers `401` and its `hint` gives the one call that gets
    a test key (`curl -X POST https://api.flow.engineer/v1/sandbox/keys`).

    The key's mode chooses the tools. A `fk_test_` key gets build-time tools to
    integrate and verify an app end to end: `whoami`, `sandbox_join`,
    `send_test_message`, `simulate_inbound`, `get_test_transcript`,
    `wait_for_event`, `list_events`, `get_webhook_deliveries`, `replay_event`,
    `capabilities` and `explain_error`. A `fk_live_` key gets
    production tools: `send_message`, `reply`, `react`, `typing`,
    `list_conversations` and `get_conversation_messages`, plus `whoami`,
    `capabilities` and `explain_error`. Every send passes the same send gate as
    the REST API, and a refusal comes back as the tool's error with the same
    `type`, `hint` and `doc_url`.
  contact:
    name: Flow Engineer
    url: https://docs.flow.engineer
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.flow.engineer
    description: Production. Test and live mode are chosen by the API key.
security:
  - bearerAuth: []
tags:
  - name: Messages
    description: Send content into conversations, start conversations, edit and unsend messages.
  - name: Conversations
    description: One sender talking with one contact. Read history, show typing, mark as read.
  - name: Events
    description: The ordered log of everything that happened in your app. Catch up, replay and debug.
  - name: Stream
    description: Live events over a WebSocket, resumable from any event.
  - name: Capabilities
    description: What a conversation's channel can show right now, and whether its window is open.
  - name: Files
    description: Media in and out. Flow fetches channel media for you and serves it through short-lived URLs.
  - name: Senders
    description: The Telegram bots, WhatsApp numbers, iMessage lines and SMS numbers your app sends from.
  - name: Templates
    description: WhatsApp message templates, mirrored from Meta with their approval status.
  - name: Webhook endpoints
    description: Where Flow delivers your app's events.
  - name: Contacts
    description: People your app talks with, one per channel.
  - name: App
    description: The app and key making the request.
  - name: Testing
    description: |
      Test keys only. Simulated contacts: create a conversation with an end user who
      exists only inside Flow, write as them, and read what your agent sent back, with
      no phone and no real channel.
  - name: Onboarding
    description: |
      Get a test key without an account (`POST /v1/sandbox/keys`), and sign in with
      a Flow account (flow.engineer) through the device flow to claim the app and
      lift its sandbox allowance. These endpoints take no API key.

paths:
  /v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Send a message into a conversation
      description: |
        Sends one piece of content into an existing conversation. This is the normal
        way to reply to a contact. The send passes the send gate (window rules,
        pacing) and is queued; the answer is the queued message. Its progress arrives
        as `message.sent`, `message.delivered`, `message.read` or `message.failed`
        events. Messages in one conversation go out in the order they were accepted,
        one at a time.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            examples:
              text:
                summary: A plain text reply
                value:
                  content: {type: text, text: "Yes, we deliver to 560103. Delivery takes 2 days."}
              buttons_with_fallback:
                summary: Buttons, with the channel's default fallback allowed
                value:
                  content:
                    type: buttons
                    text: "Which size?"
                    buttons:
                      - {id: size_s, label: Small}
                      - {id: size_m, label: Medium}
                      - {id: size_l, label: Large}
                  fallback: auto
      responses:
        "202":
          description: The message passed the gate and is queued for the channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnsupportedContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listConversationMessages
      tags: [Conversations]
      summary: List a conversation's messages
      description: |
        Lists the messages in a conversation, inbound and outbound, newest first.
        Message content is kept for your plan's retention period (30 days by
        default); older messages are not returned.
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/messages:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: startConversation
      tags: [Messages]
      summary: Start a conversation
      description: |
        Sends the first message from one of your senders to a contact, creating the
        conversation if it does not exist. Starting a conversation spends the sender's
        new-contact budget, and on WhatsApp outside the 24-hour window only a
        `template` may be sent. If the contact already has an open conversation with
        this sender, the message goes into it and spends no budget.

        In test mode, `to` must be a contact who joined the sandbox through your app.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationRequest"
            examples:
              whatsapp_template:
                summary: A WhatsApp template to a phone number
                value:
                  sender: snd_01JB8Z4Q3V6W0R2N7C5H1M9K4T
                  to: {phone: "+919812345678"}
                  content:
                    type: template
                    template_id: tpl_01JB8Z9X2D4F6H8K0M2P4R6T8V
                    language: en
                    params: {body: ["Asha", "order 1042"]}
      responses:
        "202":
          description: The message passed the gate and is queued. Its `conversation` is the conversation it went into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnsupportedContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getMessage
      tags: [Messages]
      summary: Get a message
      description: Returns one message, inbound or outbound, with its current status.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: editMessage
      tags: [Messages]
      summary: Edit a sent message
      description: |
        Replaces the text of one of your outbound messages (on Telegram, also the
        caption of a media message, which takes at most 1024 characters where a text
        message takes 4096). Telegram and iMessage support edits (iMessage:
        within 15 minutes of sending, and not the message that started the
        conversation); WhatsApp does not (`422 unsupported_content`).

        The edit passes the send gate and goes out in order with the conversation's
        other messages. The answer shows the message with its new content; the stored
        message takes it once the channel accepted the edit. If the channel refuses
        it, you receive `message.failed` for an `edit` message naming this one.
        Only your app's outbound messages can be edited: an inbound message's ID
        answers `400 invalid_request` (`param` `message_id`). The gate's sender and
        contact checks apply as for a send, so the edit can answer `403 permission`
        (for example a sandbox contact who has since joined another app).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: The edit was accepted. The message shows its new content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnsupportedContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unsendMessage
      tags: [Messages]
      summary: Unsend a message
      description: |
        Removes one of your outbound messages from the contact's chat, where the
        channel allows it (Telegram: yes, within 48 hours; iMessage: yes, within
        2 minutes of sending; WhatsApp: no, `422 unsupported_content`). The unsend passes the send gate and goes out in order with the
        conversation's other messages; the message stays in your history and takes
        status `unsent` once the channel removed it. Repeating the call is safe.
        Only your app's outbound messages can be unsent: an inbound message's ID
        answers `400 invalid_request` (`param` `message_id`). The gate's sender and
        contact checks apply as for a send, so the unsend can answer `403
        permission` (for example a sandbox contact who has since joined another app).
      responses:
        "200":
          description: The message was unsent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnsupportedContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations/{conversation_id}/typing:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: setTyping
      tags: [Conversations]
      summary: Show or stop the typing indicator
      description: |
        Turns the typing indicator on or off in a conversation. Channels clear it by
        themselves after a few seconds, so keep turning it on while your agent works.
        Where a channel has no typing indicator the call succeeds and `delivered_as`
        says it was skipped.

        The call goes to the channel at once, not behind the conversation's queued
        messages, so the channel's answer is the call's answer. It fails with
        `409 outside_window` when the channel allows typing only inside a window
        (iMessage: within 5 minutes of the contact's last message; WhatsApp: within
        24 hours of it, and only after the contact wrote at least once), and with
        `502 channel_error` when the channel failed or timed out. Both are safe to
        ignore: typing is a courtesy, so never hold back a reply because of it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingRequest"
      responses:
        "202":
          description: The channel showed or cleared the indicator, or `delivered_as` says it was skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationAction"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ChannelError"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations/{conversation_id}/read:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: markRead
      tags: [Conversations]
      summary: Mark messages as read
      description: |
        Shows the contact that their messages were read, up to and including
        `up_to` (default: the latest inbound message). Telegram bots cannot send read
        receipts, so there `delivered_as` says it was skipped. iMessage has no
        per-message read receipt: the whole conversation is marked read, and `up_to`
        is accepted but has no effect there.

        The call goes to the channel at once, so the channel's answer is the call's
        answer. On iMessage it fails with `409 outside_window` before the contact
        has written in the conversation (there is nothing to mark read yet); on
        WhatsApp read receipts go at any time, also outside the 24-hour window. It
        fails with `502 channel_error` when the channel failed or timed out. Both
        are safe to ignore; never hold back a reply because of them.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadRequest"
      responses:
        "202":
          description: The channel took the read receipt, or `delivered_as` says it was skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationAction"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ChannelError"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: List conversations
      description: Lists your app's conversations in this mode, newest first.
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
        - name: sender
          in: query
          required: false
          description: Only conversations on this sender.
          schema:
            $ref: "#/components/schemas/SenderId"
        - name: contact
          in: query
          required: false
          description: Only conversations with this contact.
          schema:
            $ref: "#/components/schemas/ContactId"
        - name: channel
          in: query
          required: false
          description: Only conversations on this channel.
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getConversation
      tags: [Conversations]
      summary: Get a conversation
      description: Returns one conversation with its window state.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/events:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: listEvents
      tags: [Events]
      summary: List events
      description: |
        Reads your app's event log in this mode, **oldest first**. Pass the ID of the
        last event you processed as `after` to catch up after downtime, or to replay
        from any point. The log is the same one webhooks and the stream deliver from,
        so it is also how you recover events whose webhook deliveries failed.

        The log only returns events once every event before them is committed, so
        reading forward with `after` never skips an event.
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          required: false
          description: Only events of these types. Repeat the parameter for several (`type=message.received&type=reaction.added`).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/EventType"
        - name: conversation
          in: query
          required: false
          description: Only events in this conversation. An ID with no conversation of this app and mode answers `404 not_found`.
          schema:
            $ref: "#/components/schemas/ConversationId"
      responses:
        "200":
          description: A page of events, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getEvent
      tags: [Events]
      summary: Get an event
      description: Returns one event from the log.
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/stream:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: openStream
      tags: [Stream]
      summary: Open the live event stream (WebSocket)
      description: |
        Upgrades to a WebSocket that pushes your app's events as they happen, in log
        order. Pass `after` to resume from the last event you saw: the stream first
        replays everything after it, then goes live, so a reconnect never loses an
        event.

        Every WebSocket text frame is one JSON object (`StreamFrame`). The server
        sends `event` frames; the client may send `send` frames with the same bodies
        as the HTTP send endpoints, and gets one `ack` or `error` frame back for each,
        matched by `ref`. When the server is about to restart it sends a `reconnect`
        frame; reconnect with `after` set to the last event you received.

        Authenticate with the `Authorization` header where your WebSocket client can
        set headers. Where it cannot (a browser's `WebSocket`, and Node's global
        `WebSocket` on the server), offer the key as a WebSocket subprotocol instead:
        offer both `flow` and `flow.key.<api key>`, for example
        `new WebSocket("wss://api.flow.engineer/v1/stream", ["flow", "flow.key." + key])`.
        This works from server-side clients as well as browsers. The server selects
        `flow` and never echoes the key. Offering the key protocol without `flow` is
        refused with a plain `400 invalid_request` answer, without an upgrade. When an `Authorization` header is present it
        takes precedence. Keys are never accepted in the query string, since URLs end
        up in logs. A key used in a browser is visible to whoever uses that page: do
        this only for internal tools or with test keys (`fk_test_`).

        **Refusals arrive on the socket.** Many WebSocket clients (Node's and
        browsers' among them) cannot read the HTTP status of a refused upgrade, so
        a WebSocket request that Flow refuses (a missing, unknown, revoked or
        expired key, a bad parameter, too many streams for the key, a restart) is
        still upgraded: the server sends one `error` frame with the usual error
        body (`type`, `message`, `hint`, `retry_after`, `channel_code`, ...), then
        closes with an application close code of 4000 plus the HTTP status the
        error has elsewhere, and a short reason:

        - `4401`: `authentication`. The key is missing, malformed, unknown, revoked
          or expired (`channel_code` `sandbox_key_expired`). Stop reconnecting
          until you have a working key.
        - `4403`: `permission`. The key may not open this stream. Stop
          reconnecting.
        - `4400`: `invalid_request`, for example a bad `after` or `type`. Fix the
          request; reconnecting unchanged fails again.
        - `4429`: `rate_limited`, for example more open streams than the key may
          hold. Reconnect after `retry_after` seconds.
        - `4500`, `4503`: Flow could not open the stream just now, or is
          restarting. Reconnect after `retry_after` seconds with the same `after`.

        An open stream re-checks its key about once a minute: when the key is
        revoked, the stream sends an `authentication` error frame and closes with
        `4401` too. Other closes: `1012` after a `reconnect` frame (reconnect at
        once with `after`), `1008` after too many rate-limited `send` frames in a
        row, `1001` when pings go unanswered, `1011` when the event log is
        unavailable; reconnect with `after` after any of these. A request without
        a WebSocket upgrade gets the same errors as plain HTTP answers.
      parameters:
        - $ref: "#/components/parameters/After"
        - name: type
          in: query
          required: false
          description: Only events of these types. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/EventType"
      responses:
        "101":
          description: |
            Switching to the WebSocket protocol. The schema below describes each JSON
            frame on the socket, in either direction. A refused WebSocket request is
            upgraded too, then answered with one `error` frame and a 4000-range close
            code (see the description); the 4xx answers below are what a request
            without an upgrade gets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamFrame"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/capabilities:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getCapabilities
      tags: [Capabilities]
      summary: Get a conversation's capabilities
      description: |
        Says what the conversation's channel can show right now, content type by
        content type (natively, through a fallback, or not at all), and whether the
        conversation's window is open. Use it to choose content before sending,
        instead of handling `unsupported_content` and `outside_window` afterwards.
      parameters:
        - name: conversation
          in: query
          required: true
          description: The conversation to describe.
          schema:
            $ref: "#/components/schemas/ConversationId"
      responses:
        "200":
          description: The conversation's capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/files:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a file
      description: |
        Uploads media to send later as `media` or `voice` content (by `file_id`).
        The real type is checked from the file's first bytes: programs, web pages and
        unknown types are refused with `422 unsupported_content`. Images, audio and
        video are not scanned and are taken. Documents (PDF, Office documents,
        archives) are stored only after a malware scan: one that fails the scan is
        refused with `422 file_blocked` and not stored. If the scan cannot run just
        then, the upload answers `500 api_error` with `Retry-After` and nothing is
        stored; retry it with the same `Idempotency-Key`. A document can also go
        without an upload: send `media` content with `kind` `document` and a public
        HTTPS `url` in place of `file_id`, and the channel fetches it from that URL
        (Flow neither stores nor scans it; on Telegram this works for PDF and ZIP
        files).
        Files up to 100 MB are taken; give `channel` to check the file
        against that channel's own size limit now (otherwise it is checked when you
        send it, with `422 unsupported_content`). Files are kept for your plan's
        retention period (30 days by default).

        An app made without an account (`POST /v1/sandbox/keys`) that is not claimed
        yet uploads at most 20 files in any 24 hours; past that an upload answers
        `403 permission` with `channel_code` `sign_in_required`. Reuse a `file_id`
        you already have, wait for the oldest upload to age out, or sign in to lift
        the limit.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "201":
          description: The file was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            `permission`: an app made without an account, not claimed yet, past its
            20 uploads in any 24 hours (`channel_code` `sign_in_required`, `param`
            `file`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {type: permission, message: "This app was made without an account (POST /v1/sandbox/keys) and uploaded its 20 files for the last 24 hours.", hint: "Reuse a file_id you already uploaded, or wait for the oldest upload of the last 24 hours to age out; signing in lifts the limit.", doc_url: "https://api.flow.engineer/docs/errors/permission", param: file, channel_code: sign_in_required}
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: |
            `file_blocked`: a document failed the malware scan and was not stored.
            `unsupported_content`: the file's real type is one Flow does not take
            (programs, web pages, unknown types), or it is larger than the `channel`
            given takes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {type: file_blocked, message: "The file failed the malware scan and was not stored.", hint: "Send a different file; if you believe this one is clean, recreate it from its source and upload that.", doc_url: "https://api.flow.engineer/docs/errors/file_blocked", param: file}
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getFile
      tags: [Files]
      summary: Download a file
      description: |
        Redirects to a short-lived signed URL for the file's bytes, on Flow's
        separate file domain. Inbound media (photos, documents, voice notes) is
        fetched from the channel once, before its event is delivered, and served this
        way; event payloads link to this endpoint.
      responses:
        "200":
          description: |
            The file's bytes, served directly. Used where file storage has no separate
            file domain (local development) and for media received before Flow kept
            copies, which is fetched from the channel when asked for.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: A redirect to the file's bytes. The `Location` URL expires after 5 minutes.
          headers:
            Location:
              description: The signed URL of the file's bytes.
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ChannelError"
        default:
          $ref: "#/components/responses/Error"

  /v1/senders:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: listSenders
      tags: [Senders]
      summary: List senders
      description: |
        Lists the senders your app can use in this mode, newest first. Test keys see
        the shared sandbox senders (a sandbox sender Flow has replaced is left out;
        `GET /v1/senders/{sender_id}` still shows it, retired); live keys see your
        dedicated senders. Your app's
        simulated senders (test mode only) are listed only when asked for with
        `kind=simulated`, so code that picks a sender from this list never picks one.
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
        - name: channel
          in: query
          required: false
          description: Only senders on this channel.
          schema:
            $ref: "#/components/schemas/Channel"
        - name: kind
          in: query
          required: false
          description: Only senders of this kind. `simulated` lists your app's simulated senders (test keys only), which are otherwise left out.
          schema:
            $ref: "#/components/schemas/SenderKind"
      responses:
        "200":
          description: A page of senders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: requestSender
      tags: [Senders]
      summary: Request a dedicated sender
      description: |
        Connects a dedicated sender to your app. Telegram bots and WhatsApp numbers
        in your own WhatsApp Business Account are connected here, self-serve, with
        a live key (below). iMessage lines and US SMS numbers are connected by the
        Flow team, not by API: a request with `channel` `imessage` or `sms` answers
        `501 not_implemented` before any other check, with any key (test or live,
        claimed app or not): ask the Flow team, and the sender appears in
        `GET /v1/senders` once it is connected. Its `hint` says what to build with
        meanwhile: a Telegram bot, or simulated conversations of that channel
        (`POST /v1/test/conversations`, test keys). Never send API keys, tokens or
        passwords in a chat or email, to the Flow team or anyone else.

        - iMessage: a dedicated line attached to your app.
        - US SMS (in pilot): carriers require each number's brand and campaign to be
          registered first, so the Flow team registers and connects the number.

        To get a live key (`fk_live_...`), a person signs in to the dashboard at
        `https://api.flow.engineer/admin` (with a Flow account), switches to **Live**,
        and clicks **Create live key** on the Keys page
        (`https://api.flow.engineer/admin/keys?mode=live`). An app made without an
        account (`POST /v1/sandbox/keys`) is claimed first, by signing in through the
        device flow or its `claim_url`. For a Telegram bot or a WhatsApp number, an
        unclaimed app's key gets `403 permission` (`channel_code`
        `sign_in_required`) and a test key gets `403 permission`, each with a `hint`
        naming these steps. Telegram bots and your own WhatsApp numbers are
        self-serve; iMessage lines and SMS numbers are arranged with the Flow team,
        and the Flow team can also help you connect a WhatsApp number.

        A Telegram bot is connected at once, with a live key: give the token
        BotFather issued as `telegram_bot_token`. Flow checks it, keeps it encrypted, points the bot's
        webhook at Flow, and answers `200` with the sender `active`. The token is
        never returned. One bot is one sender:

        - Connecting a bot that is already a sender of this app updates its token in
          place and answers with the same sender (use it after revoking a token in
          @BotFather; a sender `flagged` because Telegram rejected its old token
          becomes `active` again, or `throttled` while an abuse throttle still
          runs, and its queued messages go out).
        - Connecting a bot that is a sender of another app moves it here: holding
          the token proves control of the bot. The old sender is retired (`banned`)
          and its app receives `sender.status_changed`.
        - A bot that is one of Flow's sandbox senders is refused with
          `403 permission`.

        To disconnect a bot, call `DELETE /v1/senders/{sender_id}`.

        A WhatsApp number in your own WhatsApp Business Account, under your own
        Meta app, is connected at once with a live key. In Meta Business Manager,
        first: create a Meta app of type Business with the WhatsApp product, and
        switch it to Live; add the phone number to your WhatsApp Business Account
        with an approved display name, and a payment method (Meta bills its fees
        to you directly); create a system user (Admin) with your WhatsApp
        Business Account (full control) and the app assigned, and generate a
        token that never expires with the permissions
        `whatsapp_business_messaging` and `whatsapp_business_management`. Then
        send `whatsapp_phone_number_id`, `whatsapp_business_account_id`,
        `whatsapp_access_token` (that system user token) and
        `whatsapp_app_secret` (App settings > Basic), and `display_name` if you
        like. Add `whatsapp_registration_pin` only when the number is not
        registered for the Cloud API yet: Flow then registers it with that
        six-digit two-step verification PIN (Meta allows 10 registrations per
        number in 72 hours).

        Flow checks that the number belongs to that business account, subscribes
        your app to the business account's webhooks (an existing subscription is
        left as it is), and points only this number's webhooks at Flow (Meta's
        phone-number-level override; your other numbers keep theirs). It keeps
        the token and the app secret encrypted and never returns them. The answer
        is `200` with the sender `active` and, only in this answer, `setup`: the
        callback URL and verify token to enter in your Meta app (App Dashboard >
        WhatsApp > Configuration) and the webhook fields to subscribe there, with
        the steps. One number is one sender:

        - Connecting a number that is already a sender of this app updates its
          token and app secret in place and answers with the same sender and the
          same verify token (use it to rotate the token; a sender `flagged`
          because Meta rejected its old token becomes `active` again, and its
          queued messages go out).
        - A number that is a sender of another app, or in a WhatsApp Business
          Account whose numbers are connected to another account, is refused
          with `403 permission` (`channel_code` `whatsapp_number_taken` or
          `whatsapp_account_taken`): disconnect it there first.
        - A number the Flow team connected for you is updated by the Flow team
          (`403 permission`, `channel_code` `whatsapp_number_managed`).
        - A token that is not a Meta access token answers `400 invalid_request`
          (`channel_code` `whatsapp_token_malformed`), a token Meta refuses
          (expired, revoked, or without the permissions or assets above) `400
          invalid_request` (`channel_code` `whatsapp_token_rejected`), and a
          number that is not in that business account `400 invalid_request`
          (`channel_code` `whatsapp_number_not_in_account`). Other refusals from
          Meta answer `502 channel_error` with Meta's code as `channel_code`.

        To disconnect a number, call `DELETE /v1/senders/{sender_id}`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderRequest"
      responses:
        "200":
          description: The sender is connected and `active`, or an already connected bot's token, or number's token and app secret, were updated in place. A WhatsApp number's answer carries `setup`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sender"
        "202":
          description: "The request was accepted. The sender is `pending`, and you receive `sender.status_changed` when it is ready. No request answers this way today: Telegram bots and WhatsApp numbers answer `200`, and senders of other channels are connected by the Flow team."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sender"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          description: |
            `channel` is `imessage` or `sms`: the Flow team connects these senders
            (`not_implemented`, with any key). The `hint` says how to get one and
            what to build with meanwhile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {type: not_implemented, message: "US SMS numbers are registered and connected by the Flow team, not by API: carriers require each number's brand and campaign to be registered first. Once connected, it appears in GET /v1/senders.", hint: "Ask the Flow team to connect a US SMS number to your app; it then appears in GET /v1/senders. Meanwhile, build with a Telegram bot (POST /v1/senders with telegram_bot_token and a live key) or with simulated SMS conversations (POST /v1/test/conversations with a test key). Never send API keys, tokens or passwords in a chat or email.", doc_url: "https://api.flow.engineer/docs/errors/not_implemented", param: channel}
        "502":
          $ref: "#/components/responses/ChannelError"
        default:
          $ref: "#/components/responses/Error"

  /v1/senders/{sender_id}:
    parameters:
      - $ref: "#/components/parameters/SenderId"
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getSender
      tags: [Senders]
      summary: Get a sender
      description: Returns one sender with its status, limits and, on WhatsApp, its quality rating.
      responses:
        "200":
          description: The sender.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sender"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disconnectSender
      tags: [Senders]
      summary: Disconnect a sender
      description: |
        Disconnects one of your dedicated Telegram bots or WhatsApp numbers from
        Flow. For a bot, Flow removes its webhook (best effort) and deletes its
        stored token; for a WhatsApp number, Flow deletes its stored token and app
        secret and stops taking its webhooks. Either way the sender is retired: its
        status becomes `banned`, it no longer sends or receives, and messages still
        queued from it fail. You receive `sender.status_changed`. The sender, its
        conversations and its messages stay readable. Repeating the call is safe and
        answers with the retired sender. Nothing changes in your Meta app: remove
        Flow's callback URL there, or point the number elsewhere, yourself.

        Live keys only. Shared sandbox senders belong to Flow and cannot be
        disconnected (`403 permission` with a test key). iMessage lines and SMS
        numbers, and WhatsApp numbers the Flow team manages for you, are
        disconnected by Flow, not by API (`501 not_implemented`).

        To use the bot or number again, connect it with `POST /v1/senders`; it
        becomes a new sender.
      responses:
        "200":
          description: The sender is disconnected; it is returned with status `banned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sender"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        default:
          $ref: "#/components/responses/Error"

