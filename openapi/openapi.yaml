  /v1/app:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getApp
      tags: [App]
      summary: Get the calling app
      description: |
        Returns the app, account and API key that made the request, and the mode it
        runs in. Useful to check a key and to read the app's pinned API version.
