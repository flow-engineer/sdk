  /v1/webhook_endpoints/{webhook_endpoint_id}/rotate_secret:
    parameters:
      - $ref: "#/components/parameters/WebhookEndpointId"
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: rotateWebhookEndpointSecret
      tags: [Webhook endpoints]
      summary: Rotate a webhook endpoint's signing secret
      description: |
        Makes a new signing secret for the endpoint and returns it in `secret`, shown
        only this once. The previous secret keeps signing for `overlap_seconds`
        (default 86400, one day; `0` retires it at once): during the overlap every
        delivery's `Flow-Signature` carries two `v1` values, one per secret, so you
        can deploy the new secret while the old one still verifies. When the overlap
        ends only the new secret signs. Rotating again during an overlap retires the
        older previous secret at once: at most two secrets are ever active. So send an
        `Idempotency-Key` and retry with the same key: a retry without one is a second
        rotation, which retires the secret you still have deployed. The new secret is
        never stored with the key, so a repeat of a rotation that went through answers
        `409 idempotency_conflict` instead of showing the secret again.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSecretRotateRequest"
            examples:
              default_overlap:
                summary: Keep the old secret for one day
                value: {}
              one_hour:
                summary: Keep the old secret for one hour
                value: {overlap_seconds: 3600}
      responses:
        "200":
          description: The secret was rotated. `secret` is the new secret, included this once; `previous_secret_expires_at` says when the old one stops signing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

