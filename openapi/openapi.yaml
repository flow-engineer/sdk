          description: The calling app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppContext"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/sandbox/keys:
    post:
      operationId: createSandboxKey
      tags: [Onboarding]
      security: []
      summary: Get a test key without an account
      description: |
        Creates a new app with a `fk_test_` key, without an account or sign-in. This
        is the first call for an AI coding agent that has no key: no API key is
        sent, and the answer holds everything needed to start (the key, the
        sandbox senders with their links and the app's join code).

        The key and the `claim_token` are shown **once**: save both. The app has a
        sandbox allowance of 1 contact and 50 messages sent in total on the
        Telegram sandbox, and WhatsApp's when it opens (inbound messages are free;
        iMessage is not included), and its keys **expire after 7 days**. After expiry the keys
        stop working and the contact is removed from the sandbox; a person can
        still claim the app.

        To keep the app, a person signs in through the device flow with the
        `claim_token` (`POST /v1/device/authorizations`), or opens `claim_url` in a
        browser. The app then shares the person's signed-in allowance (3 contacts
        and 100 messages each, one allowance per person over all their apps). A
        claim through `claim_url` revokes this key unless the person chooses to
        keep their agent's key working; a device sign-in replaces it with a new
        key.

        Calls are limited per client address, per network (/24, /64) and wider
        network (/16, /48), and service-wide per day; going over answers `429
        rate_limited` with `retry_after`. Do not call this when you already
        have a key: check `FLOW_MESSAGING_KEY` first, and reuse the key you saved.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxKeyRequest"
      responses:
        "201":
          description: The new app and its key. The key and the claim token are not shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxKey"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/device/authorizations:
    post:
      operationId: createDeviceAuthorization
      tags: [Onboarding]
      security:
        - {}
        - bearerAuth: []
      summary: Start a sign-in from an agent or CLI (device flow)
      description: |
        Starts a sign-in that a person finishes in a browser with a Flow account
        (flow.engineer): the OAuth 2.0 device authorization grant (RFC 8628) in
        Flow's JSON shape.
        Show the person `verification_uri` and `user_code`: they open the page,
        sign in and type the code you show them. Then poll `POST /v1/device/token`
        with `device_code` every `interval` seconds until it returns a key.

        To claim an app made with `POST /v1/sandbox/keys`, pass its `claim_token`,
        or send that app's test key as `Authorization: Bearer fk_test_...` (a key
        of an app that is already claimed is ignored). When
        the person approves, the app joins their account: its data and keys are
        kept, its keys no longer expire (a key that expired less than 30 days ago
        works again), and the app moves under the person's signed-in allowance: 3
        contacts and 100 messages each, one allowance per person, shared by every
        app they own or claim. A person may claim up to 10 apps; past that the
        approval page refuses the claim. An expired key claims its app only for 30
        days after its `expires_at`; after that, use the `claim_token`. Without
        either, approving gives a new test key for the person's own app (made at
        their first sign-in).

        The approval page asks the person to type `user_code` as the agent or CLI
        shows it, so a link alone cannot approve a sign-in someone else started.

        No API key is needed. Calls are limited per client address and network.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
      responses:
        "201":
          description: The sign-in was started. Show the person the link and code, then poll for the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/device/token:
    post:
      operationId: pollDeviceToken
      tags: [Onboarding]
      security: []
      summary: Poll a device sign-in for its key
      description: |
        Answers the state of a sign-in started with `POST /v1/device/authorizations`.
        While the person has not finished, `status` is `pending`: wait `interval`
        seconds and poll again. Polling faster answers `429 rate_limited` with
        `retry_after`. Once they approve, `status` is `approved` and the answer
        holds a new `fk_test_` key, shown once; the device code is then used up,
        and later polls answer `expired`. If the sign-in claimed a sandbox app,
        that app's sandbox keys stop working when this key is handed out: replace
        `FLOW_MESSAGING_KEY` with it. (A claim through `claim_url` in a browser
        hands out no key, and revokes the sandbox key unless the person chooses to
        keep their agent's key working.) `denied` means the person refused, and
        `expired` that the code ran out (after `expires_in` seconds): start again.
        Polls are also limited per client network, unknown codes included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: The sign-in's state, with the key once it is approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/test/conversations:
    parameters:
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: createTestConversation
      tags: [Testing]
      summary: Create a simulated conversation
      description: |
        Test keys only. Creates a conversation with a **simulated contact**, an end
        user that exists only inside Flow, so an agent or a test suite can play the
        person's side with no phone and no real channel. Write as the contact with
        `POST /v1/test/conversations/{conversation_id}/inbound`; your agent receives
        each turn exactly like a real `message.received` and replies with its normal
        send. Read both sides with `GET /v1/test/conversations/{conversation_id}/transcript`.

        The conversation is on your app's **simulated sender** for the channel
        (`kind` `simulated`), which Flow creates on first use. It never touches a
        network: sends to the simulated contact pass the real send gate and end
        `sent`. Simulated channels: `telegram`, `whatsapp`, `imessage` and `sms`.
        The channel's rules hold as on a real sender: a simulated iMessage line,
        like Flow's lines today, only replies, so the contact writes first; a
        simulated Telegram bot, like a real one, cannot write to a contact who has
        not written to it, so a send before the contact's first turn is accepted
        (`202`) and then fails as it does on real Telegram (`message.failed`,
        `channel_error`, `channel_code` `403`); on SMS
        and iMessage buttons need `fallback` and the contact answers with the
        button's number.

        On WhatsApp, the contact's turns go through the real WhatsApp inbound path,
        so each turn opens the 24-hour window. Outside it, including before the
        contact's first turn, only a `template` can be sent (`409 outside_window`).
        Buttons go as up to 3 reply buttons, or a list for 4 to 10; reactions and
        `reply_to` work; edits and unsends answer `422 unsupported_content`.

        On SMS, the rules that concern the contact hold too. Before the contact's
        first turn, a send to them is a start that needs their recorded consent:
        without `consent` (on `POST /v1/messages` with `to.contact`), it answers
        `403 permission` with `channel_code` `consent_required`, as a real SMS start
        does. A turn with the text STOP opts the contact out and START lifts it (see
        `POST /v1/test/conversations/{conversation_id}/inbound`). A simulated SMS
        sender keeps no quiet hours, so a test's outcome never depends on the time of
        day, and it sends media and voice as MMS.

        Creating the conversation sends no event. The conversation starts with its
        first message: the contact's first turn (`via` `inbound`), or your first send
        to the contact, such as a WhatsApp template or an SMS send with consent
        (`via` `outbound`). `conversation.started` comes before that message's
        `message.received` or `message.sent`.

        Give `contact` to choose the simulated contact's address; giving an address
        that already has a simulated conversation returns that conversation (`200`).
        Without `contact`, Flow makes a new contact with a made-up address (phone
        numbers start `+1555`), so each call is a fresh conversation, for example one
        per test case. Simulated contacts never match real ones, even with the same
        address.

        Simulated traffic is free: it does not count against the sandbox allowance.
        An app has at most 500 simulated conversations: past that, a new one answers
        `403 permission` with `channel_code` `simulated_conversation_limit` (an
        address that has one still returns it with `200`), so reuse conversations
        across test runs. The `/v1/test/` endpoints take at most 120 requests a
        minute per key (`429 rate_limited`), on top of the plan's request rate
        limit. A live key answers `403 permission` with `channel_code`
        `test_mode_only`.

        A HIPAA account (`Account.hipaa`) can simulate only the channels its
        business associate agreement covers (SMS), as it can connect senders only
        there: `telegram`, `whatsapp` or `imessage` answers `403 permission` with
        `channel_code` `hipaa_channel_not_covered` (`param` `channel`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestConversationRequest"
            examples:
              sms:
                summary: A new SMS contact with a made-up number
                value: {channel: sms, name: "Test contact"}
              telegram:
                summary: A Telegram contact with a chosen user ID
                value: {channel: telegram, contact: {telegram_user_id: "700100200"}, name: Asha}
      responses:
        "201":
          description: The simulated conversation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "200":
          description: The contact's simulated conversation already existed; it is returned as is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            `permission`: a live key (`channel_code` `test_mode_only`), the app's
            500 simulated conversations reached (`simulated_conversation_limit`), or
            a HIPAA account asking for a channel its business associate agreement
            does not cover (`hipaa_channel_not_covered`; only `sms` can be simulated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {type: permission, message: "This account handles health information under a business associate agreement, and Telegram is not a channel Flow holds such an agreement for, so it cannot be simulated here either.", hint: "Simulate an SMS conversation instead: POST /v1/test/conversations with {\"channel\":\"sms\"}.", doc_url: "https://api.flow.engineer/docs/errors/permission", param: channel, channel_code: hipaa_channel_not_covered}
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/test/conversations/{conversation_id}/inbound:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/FlowVersion"
    post:
      operationId: simulateInbound
      tags: [Testing]
      summary: Write as the simulated contact
      description: |
        Test keys only. Posts one inbound turn from the simulated contact of a
        simulated conversation. It goes through the same inbound path as a real
        channel's message: Flow stores it, then delivers it as a `message.received`
        event by webhook, on the stream and in the event log, in order with the
        conversation's other events. A webhook answer's `reply` works as usual. The
        answer comes before delivery; the `message.received` event carries the
        `message` ID given here.

        `content` is what the contact sends: `text`, `media`, `voice`, `location`,
        `contact_card` or `button_reply` (a tap on a reply button of a buttons
        message your agent sent, given as its `message_id` and `button_id`: Flow
        fills in the button's `label`; a numbered answer such as `2` to buttons
        sent as numbered text comes back as `button_reply` too, as on a real
        channel). Media and voice take the
        `file_id` of a file uploaded with `POST /v1/files` (no `url`); the contact's
        message refers to that same file (its `file_id`, `url`, `mime_type` and
        `size_bytes`): Flow does not copy it again. The channel's rules apply:
        content it cannot carry from a person (a document over SMS, a location over
        SMS, a file larger than the channel fetches from a person) answers
        `422 unsupported_content`, and text over its `max_text_length` answers
        `400 invalid_request`.

        On SMS, the keywords work as from a real phone, matched against the whole
        text. STOP (or STOPALL, UNSUBSCRIBE, CANCEL, END, QUIT, REVOKE, OPT OUT,
        OPTOUT) opts the simulated contact out against the simulated sender: the
        contact's `opted_out_at` is set and `opted_out_via` is `keyword`, and sends
        to them answer `403 permission` with `channel_code` `contact_opted_out`.
        START (or UNSTOP, YES) lifts it. The turn is still delivered as
        `message.received`. A keyword reply is never recorded as a message, so the
        transcript shows no automatic reply to STOP, START or HELP.

        On WhatsApp, each turn opens the conversation's 24-hour window, as a real
        contact's message does.

        A conversation that is not simulated answers `403 permission` with
        `channel_code` `not_simulated`; a live key answers `403 permission` with
        `channel_code` `test_mode_only`. In a HIPAA account (`Account.hipaa`), a
        turn on a simulated `telegram`, `whatsapp` or `imessage` conversation (one made before
        the flag was set) answers `403 permission` with `channel_code`
        `hipaa_channel_not_covered` (`param` `conversation_id`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatedInboundRequest"
            examples:
              text:
                summary: A text from the contact
                value:
                  content: {type: text, text: "Do you deliver on Sundays?"}
              mms:
                summary: A photo with a caption (an MMS on SMS)
                value:
                  content: {type: media, kind: image, file_id: file_01JB8ZG7Q9S1V3X5Z7B9D1F3G5, caption: "Do you have this in blue?"}
              tap:
                summary: A tap on a reply button of a buttons message your agent sent
                value:
                  content: {type: button_reply, message_id: msg_01JB8ZD4M6P8R0T2V4X6Z8B0C2, button_id: "yes"}
      responses:
        "202":
          description: The turn was accepted; `message.received` follows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedInbound"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            `permission`: a live key (`channel_code` `test_mode_only`), a
            conversation that is not simulated (`not_simulated`), or, in a HIPAA
            account, a simulated conversation on a channel its business associate
            agreement does not cover (`hipaa_channel_not_covered`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {type: permission, message: "This account handles health information under a business associate agreement, and Telegram is not a channel Flow holds such an agreement for, so it cannot be simulated here either.", hint: "Simulate an SMS conversation instead: POST /v1/test/conversations with {\"channel\":\"sms\"}.", doc_url: "https://api.flow.engineer/docs/errors/permission", param: conversation_id, channel_code: hipaa_channel_not_covered}
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnsupportedContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/test/conversations/{conversation_id}/transcript:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/FlowVersion"
    get:
      operationId: getTestTranscript
      tags: [Testing]
      summary: Read a simulated conversation, both ways
      description: |
        Test keys only. Lists a simulated conversation's messages, both directions,
        **oldest first**, so a test can page forward with `after` (the last message
        ID it has) to see what your agent sent back to the simulated contact. Each
        entry is a `Message` with, for a sent message, `shown`: what the simulated
        contact's phone shows, after the send gate applied any fallback (numbered
        text for buttons on SMS, or a list for 4 to 10 buttons on WhatsApp, for
        example).

        A conversation that is not simulated answers `403 permission` with
        `channel_code` `not_simulated`; a live key answers `403 permission` with
        `channel_code` `test_mode_only`.
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the transcript, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestTranscript"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

webhooks:
  event:
    post:
      operationId: receiveEvent
      tags: [Webhook endpoints]
      summary: An event delivered to your endpoint
      description: |
        Flow `POST`s each event your endpoint subscribes to, one event per request,
        in order per conversation. Verify `Flow-Signature` before trusting the body
        (see "Webhooks" in the introduction). Deliveries are at least once:
        deduplicate on the event's `id`.

        To reply at once to a `message.received` event, answer `200` with a
        `WebhookReply` body; the reply goes into the event's conversation through the
        send gate, as if you had called `POST /v1/conversations/{conversation_id}/messages`
        with the event's `id` as the idempotency key. `fallback` applies to every
        piece of the reply. For any other event, or to reply later, answer `200` with
        an empty body, `{}`, `{"reply": null}` or any body that is not a JSON object
        with `reply` (plain text such as `OK` included): nothing is sent and it is not
        an error.

        An answer to a `message.received` delivery that is a JSON object with a
        `reply` that is not valid (a `reply` that is not content or a list of
        content, an empty list, more than 10 pieces, an unknown `fallback`), or a
        body that starts with `{` but is not valid JSON, sends nothing at all, not
        even the valid pieces. It is recorded
        on the delivery as an `invalid_request` error with the reason, which the MCP
        tool `get_webhook_deliveries` shows; the delivery counts as delivered and is
        not retried. A piece that the send gate refuses is reported as a
        `message.failed` event.
      parameters:
        - name: Flow-Signature
          in: header
          required: true
          description: "`t=<unix seconds>,v1=<hex HMAC-SHA256 of \"t.{t}.{body}\">`, with one `v1` per active signing secret."
          schema:
            type: string
            examples: ["t=1791763200,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd"]
        - name: Flow-Event-Id
          in: header
          required: true
          description: The event's `id`, also in the body. Use it to deduplicate.
          schema:
            $ref: "#/components/schemas/EventId"
        - name: Flow-Event-Type
          in: header
          required: true
          description: The event's `type`, also in the body.
          schema:
            $ref: "#/components/schemas/EventType"
        - name: Flow-Version
          in: header
          required: true
          description: The API version the event body is shaped by (your app's pinned version).
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: The event was received. Optionally carries a reply to send into the event's conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReply"
              examples:
                reply:
                  summary: A text reply
                  value:
                    reply: {type: text, text: "Yes, we deliver to 560103."}
                string_reply:
                  summary: A text reply given as a string
                  value:
                    reply: "Yes, we deliver to 560103."
                no_reply:
                  summary: No reply now
                  value: {}
        "4XX":
          description: Any other answer, or no answer within 10 seconds, is a failed delivery and is retried with backoff for 3 days.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: fk_test_... or fk_live_...
      description: |
        An API key of one app, sent as `Authorization: Bearer <key>`. Keys start with
        `fk_test_` (test mode: sandbox senders and test data only) or `fk_live_`
        (live mode). Keep live keys on your server; never ship them in an app or page.

  parameters:
    FlowVersion:
      name: Flow-Version
      in: header
      required: false
      description: The API version to use, as a date. Without it, the version pinned to your app when it was created is used.
      schema:
        type: string
        format: date
        examples: ["2026-11-01"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A unique string (up to 255 characters) that makes this request safe to retry.
        A repeat with the same key within 24 hours returns the first answer instead of
        acting again. See "Idempotency" in the introduction.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    After:
      name: after
      in: query
      required: false
      description: An item ID. Returns the items that come after it in the list's order.
      schema:
        type: string
        maxLength: 64
    Before:
      name: before
      in: query
      required: false
      description: An item ID. Returns the items that come before it in the list's order.
      schema:
        type: string
        maxLength: 64
    Limit:
      name: limit
      in: query
      required: false
      description: How many items to return, 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: The conversation's ID.
      schema:
        $ref: "#/components/schemas/ConversationId"
    MessageId:
      name: message_id
      in: path
      required: true
      description: The message's ID.
      schema:
        $ref: "#/components/schemas/MessageId"
    EventId:
      name: event_id
      in: path
      required: true
      description: The event's ID.
      schema:
        $ref: "#/components/schemas/EventId"
    FileId:
      name: file_id
      in: path
      required: true
      description: The file's ID.
      schema:
        $ref: "#/components/schemas/FileId"
    SenderId:
      name: sender_id
      in: path
      required: true
      description: The sender's ID.
      schema:
        $ref: "#/components/schemas/SenderId"
    TemplateId:
      name: template_id
      in: path
      required: true
      description: The template's ID.
      schema:
        $ref: "#/components/schemas/TemplateId"
    WebhookEndpointId:
      name: webhook_endpoint_id
      in: path
      required: true
      description: The webhook endpoint's ID.
      schema:
        $ref: "#/components/schemas/WebhookEndpointId"
    ContactId:
      name: contact_id
      in: path
      required: true
      description: The contact's ID.
      schema:
        $ref: "#/components/schemas/ContactId"

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    RateLimitLimit:
      description: Requests allowed in the current window for this key.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window for this key.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer

  responses:
    Error:
      description: An error. `error.type` says which (see `ErrorType`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: |
        The request is malformed or a parameter is invalid (`invalid_request`).
        `error.param` names the parameter. Every endpoint answers this for a
        `Flow-Version` header that is not a date this API serves (`param`
        `Flow-Version`), and every `POST` that takes an `Idempotency-Key` for a key
        over 255 characters (`param` `Idempotency-Key`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: invalid_request, message: "limit must be between 1 and 100.", hint: "Pass limit between 1 and 100 (default 20), and page with after or before.", doc_url: "https://api.flow.engineer/docs/errors/invalid_request", param: limit}
    Unauthenticated:
      description: The API key is missing, malformed, unknown, revoked or expired (`authentication`).
      headers:
        WWW-Authenticate:
          description: |
            The authentication scheme, `Bearer realm="api.flow.engineer"`. When the
            request carried a key that is well formed but unknown, revoked or
            expired, it also says `error="invalid_token"`:
            `Bearer realm="api.flow.engineer", error="invalid_token"`. A missing or
            malformed key gets the scheme alone.
          schema:
            type: string
            examples: ['Bearer realm="api.flow.engineer", error="invalid_token"']
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: authentication, message: "No valid API key was given.", hint: "Send the header Authorization: Bearer fk_test_... (or fk_live_...); no key yet? Get a test key with curl -X POST https://api.flow.engineer/v1/sandbox/keys", doc_url: "https://api.flow.engineer/docs/errors/authentication"}
    PermissionDenied:
      description: The key may not do this, for example a test key using a live sender (`permission`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such object for this app and mode (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The request conflicts with the current state: the channel's window is closed
        (`outside_window`: WhatsApp's 24 hours for free-form messages, iMessage's
        5 minutes after the contact's last message for typing), or the idempotency
        key was used for a different request or is still in use
        (`idempotency_conflict`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: outside_window, message: "Last message from the contact was 31h ago; WhatsApp allows only templates now.", hint: "Send a template instead: POST /v1/messages with content.type=template.", doc_url: "https://api.flow.engineer/docs/errors/outside_window", conversation: conv_01JB8ZC3K5M7P9R1T3V5X7Z9B1}
    IdempotencyConflict:
      description: |
        The `Idempotency-Key` was already used (`idempotency_conflict`):
        `channel_code` `body_mismatch` (a different method, path or body; use a new
        key), `in_progress` (the first request with the key is still running; repeat
        it after `retry_after` seconds), or `secret_not_kept` (the first request went
        through and its answer carried a secret shown only once). See "Idempotency"
        in the introduction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: idempotency_conflict, message: "This Idempotency-Key was already used for a different request (another method, path or body).", hint: "Use a new Idempotency-Key for this request; reuse a key only to repeat the identical request.", doc_url: "https://api.flow.engineer/docs/errors/idempotency_conflict", param: Idempotency-Key, channel_code: body_mismatch}
    PayloadTooLarge:
      description: |
        The request body is larger than Flow takes (`invalid_request`): 32 MB, or
        101 MB for `POST /v1/files` (a 100 MB file and its multipart framing). A body
        that declares a larger `Content-Length` is refused before it is read. Send
        media as a `file_id` from `POST /v1/files` or by `url` instead of inlining it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: invalid_request, message: "The request body is larger than 33554432 bytes.", hint: "Send a smaller body; upload media with POST /v1/files and send its file_id instead of inlining it.", doc_url: "https://api.flow.engineer/docs/errors/invalid_request"}
    NotImplemented:
      description: |
        Not available through the API during the beta (`not_implemented`), for
        example a sender of a channel the Flow team connects and disconnects for
        you. The `hint` says what to do instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedContent:
      description: The channel cannot show this content and the request set no `fallback` (`unsupported_content`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: unsupported_content, message: "iMessage cannot show buttons.", hint: "Set \"fallback\": \"auto\" to send numbered text instead, or send text.", doc_url: "https://api.flow.engineer/docs/errors/unsupported_content", param: content.type}
    ChannelError:
      description: |
        The channel refused the call, failed or timed out (`channel_error`).
        `error.channel_code` carries the channel's own code where it gave one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: channel_error, message: "The channel refused: the request timed out.", hint: "Typing and read receipts are safe to ignore; carry on and send your reply.", doc_url: "https://api.flow.engineer/docs/errors/channel_error", conversation: conv_01JB8ZC3K5M7P9R1T3V5X7Z9B1}
    RateLimited:
      description: |
        Too many requests (`rate_limited`): either this key's request limit (see the
        `RateLimit-*` headers) or the sender's sending rate (pacing) was exceeded;
        retry after `Retry-After` seconds (also `error.retry_after`) with the same
        `Idempotency-Key`. Or the sender has used its budget for starting
        conversations (`new_contact_limit`), or the sender is throttled after abuse
        signals (`sender_throttled`); wait `retry_after` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {type: new_contact_limit, message: "This sender has started its 15 new conversations for today.", hint: "Retry after 3600 seconds; replies into existing conversations still go.", doc_url: "https://api.flow.engineer/docs/errors/new_contact_limit", retry_after: 3600, sender: snd_01JB8Z4Q3V6W0R2N7C5H1M9K4T}

  schemas:
    # ---------------------------------------------------------------- IDs
    AccountId:
      type: string
      description: An account ID, `acct_` and a ULID.
      pattern: "^acct_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["acct_01JB8YZ3N2Q4R6T8V0X2Z4B6D8"]
    AppId:
      type: string
      description: An app ID, `app_` and a ULID.
      pattern: "^app_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["app_01JB8Z0A1C3E5G7J9K1M3P5R7T"]
    ApiKeyId:
      type: string
      description: An API key's ID, `key_` and a ULID. Not the secret key itself.
      pattern: "^key_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["key_01JB8Z1B2D4F6H8K0M2P4R6T8W"]
    SenderId:
      type: string
      description: A sender ID, `snd_` and a ULID.
      pattern: "^snd_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["snd_01JB8Z4Q3V6W0R2N7C5H1M9K4T"]
    ContactId:
      type: string
      description: A contact ID, `ct_` and a ULID.
      pattern: "^ct_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["ct_01JB8ZB2J4K6N8Q0S2V4W6Y8A0"]
    ConversationId:
      type: string
      description: A conversation ID, `conv_` and a ULID.
      pattern: "^conv_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["conv_01JB8ZC3K5M7P9R1T3V5X7Z9B1"]
    MessageId:
      type: string
      description: A message ID, `msg_` and a ULID.
      pattern: "^msg_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["msg_01JB8ZD4M6P8R0T2V4X6Z8B0C2"]
    EventId:
      type: string
      description: An event ID, `evt_` and a ULID.
      pattern: "^evt_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["evt_01JB8ZE5N7Q9S1V3X5Z7B9D1E3"]
    WebhookEndpointId:
      type: string
      description: A webhook endpoint ID, `we_` and a ULID.
      pattern: "^we_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["we_01JB8ZF6P8R0T2W4Y6A8C0E2F4"]
    TemplateId:
      type: string
      description: A template ID, `tpl_` and a ULID.
      pattern: "^tpl_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["tpl_01JB8Z9X2D4F6H8K0M2P4R6T8V"]
    FileId:
      type: string
      description: A file ID, `file_` and a ULID.
      pattern: "^file_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["file_01JB8ZG7Q9S1V3X5Z7B9D1F3G5"]

    # ---------------------------------------------------------------- shared
    Channel:
      type: string
      description: A messaging channel. `sms` is US SMS and MMS (in pilot), from dedicated numbers only.
      enum: [telegram, whatsapp, imessage, sms]
    Mode:
      type: string
      description: "`test` (sandbox senders and test data only) or `live`."
      enum: [test, live]
    Metadata:
      type: object
      description: Up to 20 string pairs of your own, kept with the object and returned unchanged. Keys up to 40 characters, values up to 500.
      maxProperties: 20
      additionalProperties:
        type: string
        maxLength: 500
    Deleted:
      type: object
      description: Confirms that an object was deleted.
      required: [id, deleted]
      properties:
        id:
          type: string
          description: The deleted object's ID.
        deleted:
          type: boolean
          description: Always `true`.

    # ---------------------------------------------------------------- errors
    ErrorType:
      type: string
      description: |
        What went wrong. A closed list: new types arrive only with a new API version.
        Each type has a page at `https://api.flow.engineer/docs/errors/<type>`, given in
        the error's `doc_url`; the error's `hint` says what to change for the case.

        - `invalid_request` (400, or 413 for a request body over the size limit): the request is malformed or a parameter is invalid. Fix the parameter named in `param`; the `hint` says what it must look like. Every endpoint answers it for a `Flow-Version` header that is not a version this API serves.
        - `authentication` (401): the API key is missing, malformed, unknown, revoked or expired. An `Authorization: Bearer` header with nothing after it usually means the environment variable holding the key was empty when the header was built (for an MCP client, when the server was added): the `hint` says so. Send `Authorization: Bearer fk_test_...` or `fk_live_...` with a current key; with no key at all, get a test key with `POST /v1/sandbox/keys`. A sandbox key past its `expires_at` has `channel_code` `sandbox_key_expired`: sign in to claim the app, or get a new key.
        - `permission` (403): the key may not do this, for example a test key using a live sender, a sandbox contact who joined another app, a new conversation from an iMessage line that may only reply, or a send past the app's sandbox allowance (`channel_code` `sandbox_allowance_used`, `sandbox_contact_limit` or `sandbox_channel_not_included`). Use the key of the right mode, have the contact send your join code, wait for the contact to message the line first, or sign in through the device flow to lift the allowance. On SMS: `contact_opted_out` (the contact texted STOP; nothing more goes to them until they text START), `consent_required` (a start to someone who never texted your numbers: record their consent with `consent` on the start). In a HIPAA account: `hipaa_channel_not_covered` (the channel has no business associate agreement; use SMS). Simulated conversations: `simulated_contact` (a real sender was pointed at a simulated contact; reply in the contact's simulated conversation), `not_simulated` (a simulated sender or test endpoint was pointed at a real contact), `test_mode_only`, `simulated_conversation_limit`. In `message.failed`: `sandbox_contact_left` (the contact joined another app on the sandbox sender while the message was queued; have them send your join code again).
        - `not_found` (404): no such object for this app and mode. Check the ID's prefix and that it was made with a key of the same mode (test and live data are separate).
        - `idempotency_conflict` (409): the idempotency key was used for a different request (`channel_code` `body_mismatch`: use a new key), or that request is still running (`in_progress`: wait `retry_after` seconds and repeat it with the same key), or it already created a secret that is shown only once (`secret_not_kept`: creating a webhook endpoint, rotating its secret, connecting a WhatsApp number; a secret that was lost must be rotated again, and a WhatsApp number connected again to see its verify token).
        - `outside_window` (409, or in `message.failed`): the channel will not deliver outside its conversation window. On WhatsApp the 24-hour window is closed: send a `template` (`POST /v1/messages` with `content.type=template`), or wait for the contact to write. On iMessage the contact has not messaged the line (or opted in) yet, or not recently, so the failure arrives as a `message.failed` event: wait for the contact to write, then reply in that conversation. Typing and read receipts answer `409 outside_window` directly when the channel's window for them is closed (iMessage typing works only within 5 minutes of the contact's last message; WhatsApp read receipts go at any time); ignore it and send your reply. On SMS, `channel_code` `quiet_hours`: the contact has not texted in the last hour and it is inside the sender's quiet hours in their time zone; retry after `retry_after` seconds, or wait for them to text. In `message.failed`: `window_closed` (WhatsApp's 24-hour window closed while the message was queued; send a template) and `queued_too_long` (the message waited in the queue longer than its sender allows, for example while the sender was paused; send it again if it still applies).
        - `unsupported_content` (422): the channel cannot show this content and no `fallback` was set. Set `fallback` (`"auto"` or your own content), or check `GET /v1/capabilities` first. `POST /v1/files` answers it for a type Flow does not take (programs, web pages, unknown types). A send by `file_id` of a document a contact sent before Flow malware-scanned documents answers it too: Flow sends only documents it scanned.
        - `new_contact_limit` (429): the sender has used its budget for starting conversations. Wait `retry_after` seconds; replies into existing conversations still go.
        - `sender_throttled` (429): abuse signals tripped (the same text to many new contacts, many starts with no reply, blocks), so the sender may not start conversations until `retry_after`; replies into existing conversations still go. Personalise first messages and start only conversations people expect.
        - `file_blocked` (422): the file failed the malware scan and was not stored. Send a different file. (When the scan cannot run at all, the upload answers a retryable `500 api_error` with `Retry-After` instead.)
        - `rate_limited` (429): either too many requests for this key (the per-key request limit, reported in the `RateLimit-*` headers) or sends faster than the sender's sending rate (pacing). Wait `Retry-After` (`retry_after`) seconds and retry with the same `Idempotency-Key`.
        - `channel_error` (502, or in `message.failed`): the channel refused or failed the message, or timed out; `channel_code` carries its own code. Read `message`, change what the channel objected to, and send again. From typing and read receipts, which call the channel at once, it is safe to ignore. SMS codes are Flow's, the same whichever carrier network carries the message: `carrier_filtered` (a carrier's spam filter blocked it: make it read like a person's message, no shortened links), `unreachable`, `invalid_number`, `landline`, `registration_required` (the number's 10DLC or toll-free registration is not approved yet), `carrier_error`, and `provider_not_configured` (the SMS sender is not fully set up on Flow's side, so nothing was sent; contact the Flow team). Flow's own codes on every channel: `channel_timeout_unknown_outcome` (in `message.failed`: the channel did not answer after the message was sent, and the resends its policy allows did not settle it, so the message may have arrived or not; check with the contact before sending it again) and `unknown_outcome` (from typing and read receipts: the call timed out after it was sent).
        - `not_implemented` (501): this endpoint or channel is not live yet during the beta. Use a channel that is live (Telegram, iMessage), or check the changelog.
        - `api_error` (500, 503): something went wrong on Flow's side. Retry with the same idempotency key after `retry_after` seconds, and quote `request_id` if it persists.
      enum:
        - invalid_request
        - authentication
        - permission
        - not_found
        - idempotency_conflict
        - outside_window
        - unsupported_content
        - new_contact_limit
        - sender_throttled
        - file_blocked
        - rate_limited
        - channel_error
        - not_implemented
        - api_error
    ErrorBody:
      type: object
      description: The details of an error.
      required: [type, message, hint, doc_url]
      properties:
        type:
          $ref: "#/components/schemas/ErrorType"
        message:
          type: string
          description: A sentence for a developer saying what went wrong. Do not parse it; switch on `type`.
        hint:
          type: string
          description: |
            One sentence saying what to change to make the request succeed, specific
            to this case, for example "Send a template instead: POST /v1/messages with
            content.type=template." Written for developers and coding agents alike. Do
            not parse it; it may be reworded at any time.
          examples: ["Send a template instead: POST /v1/messages with content.type=template."]
        doc_url:
          type: string
          format: uri
          description: The documentation page for this error's type, `https://api.flow.engineer/docs/errors/<type>`. It says what the error means, why it happens and how to fix it, with code.
          examples: ["https://api.flow.engineer/docs/errors/outside_window"]
        param:
          type: string
          description: The request parameter the error is about, as a dotted path (`content.buttons`, `limit`).
        retry_after:
          type: integer
          minimum: 0
          description: Seconds to wait before retrying, for errors that clear by themselves.
        conversation:
          $ref: "#/components/schemas/ConversationId"
        sender:
          $ref: "#/components/schemas/SenderId"
        channel_code:
          type: string
          description: |
            For `channel_error`, the channel's own error code, as given by the
            channel. For some other errors, Flow's own code naming the case, for
            example `sandbox_allowance_used` (`permission`: the sandbox allowance is
            used up), `sandbox_contact_limit` (`permission`: the allowance has no
            room for another contact), `sandbox_channel_not_included` (`permission`:
            the allowance does not cover this sandbox channel), `sign_in_required`
            (`permission`: an app made without an account cannot do this) or
            `sandbox_key_expired` (`authentication`: a key from `POST
            /v1/sandbox/keys` passed its `expires_at`; `permission`, for a send
            that carries no key, such as a reply in a webhook answer, from such an
            app). For `idempotency_conflict`, always one of `body_mismatch` (the
            key was used for a different request), `in_progress` (the first
            request is still running; `retry_after` says when to repeat it) or
            `secret_not_kept` (its answer carried a secret shown only once).
            SMS: `contact_opted_out` and `consent_required` (`permission`),
            `quiet_hours` (`outside_window`, with `retry_after`), and
            `carrier_filtered`, `unreachable`, `invalid_number`, `landline`,
            `registration_required`, `carrier_error` and `provider_not_configured`
            (`channel_error`). HIPAA accounts: `hipaa_channel_not_covered`
            (`permission`). Connecting your own WhatsApp number (`POST
            /v1/senders`): `whatsapp_token_malformed`, `whatsapp_token_rejected`,
            `whatsapp_app_secret_malformed` and `whatsapp_number_not_in_account`
            (`invalid_request`), and `whatsapp_number_taken`,
            `whatsapp_account_taken` and `whatsapp_number_managed` (`permission`).
            Simulated conversations (`permission`): `test_mode_only`,
            `not_simulated`, `simulated_contact` and `simulated_conversation_limit`.
            For a message that failed after it was queued (`message.failed`):
            `sandbox_contact_left` (`permission`), `window_closed` and
            `queued_too_long` (`outside_window`), and
            `channel_timeout_unknown_outcome` (`channel_error`: the channel never
            confirmed the send, so it may or may not have arrived). From typing and
            read receipts, `unknown_outcome` (`channel_error`: the call timed out after
            it was sent).
        request_id:
          type: string
          description: Flow's ID for this request. Quote it when asking for help.
    Error:
      type: object
      description: The body of every error answer.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    # ---------------------------------------------------------------- account, app, key
    Account:
      type: object
      description: A customer company. Holds the plan, billing and members. Every app belongs to one account.
      required: [id, name, plan, created_at]
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        name:
          type: string
          description: The company's name.
        plan:
          type: string
          description: The account's plan.
          enum: [free, pro, business, enterprise]
        hipaa:
          type: boolean
          readOnly: true
          description: |
            `true` when the account handles protected health information under a
            business associate agreement with Flow. Its messages then go only
            through channels Flow holds such an agreement for (SMS): sends, typing,
            read receipts and sender connections on Telegram, WhatsApp and iMessage
            answer `403 permission` with `channel_code` `hipaa_channel_not_covered`,
            and messages already queued there fail the same way. The sandbox
            senders answer the account's contacts with a fixed refusal and store
            and deliver nothing they send; turning the flag on ends the account's
            sandbox joins. Only SMS can be simulated (`POST /v1/test/conversations`):
            creating a simulated Telegram, WhatsApp or iMessage conversation, or posting a
            turn to one made before the flag was set, answers the same refusal.
            Set by the Flow team.
        created_at:
          type: string
          format: date-time
          description: When the account was created.
    App:
      type: object
      description: One agent integration. Owns API keys (per mode), webhook endpoints and settings.
      required: [id, account, name, api_version, settings, created_at]
      properties:
        id:
          $ref: "#/components/schemas/AppId"
        account:
          $ref: "#/components/schemas/AccountId"
        name:
          type: string
          description: The app's name.
        api_version:
          type: string
          format: date
          description: The API version pinned to the app when it was created, used when a request sends no `Flow-Version`.
        settings:
          $ref: "#/components/schemas/AppSettings"
        sandbox_join_code:
          type: string
          description: |
            The app's sandbox join code on its own, without the word `join`: two words and eight digits, for example `brave-otter-40718263`. A contact joins this app by sending `join ` followed by it to a shared sandbox sender (`join brave-otter-40718263`); each shared sender's `join_code` gives that whole message.
          examples: ["brave-otter-40718263"]
        created_at:
          type: string
          format: date-time
          description: When the app was created.
    AppSettings:
      type: object
      description: Per-app behaviour. The Flow team sets it for now; ask them to change it.
      required: [transcription, auto_read]
      properties:
        transcription:
          type: boolean
          description: When on, inbound voice notes carry a `transcript` (adds about 1 to 2 seconds to voice notes only).
        auto_read:
          type: boolean
          description: When on, Flow marks inbound messages as read as soon as your endpoint accepts them.
    ApiKey:
      type: object
      description: An API key's record. The key itself is shown once, at creation, and stored only as a hash.
      required: [id, mode, last4, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ApiKeyId"
        mode:
          $ref: "#/components/schemas/Mode"
        last4:
          type: string
          description: The key's last four characters, to tell keys apart.
          minLength: 4
          maxLength: 4
        created_at:
          type: string
          format: date-time
          description: When the key was created.
        expires_at:
          type: string
          format: date-time
          description: |
            When the key stops working. Set only on keys of an unclaimed app made with
            `POST /v1/sandbox/keys` (7 days after it was made); signing in through the
            device flow claims the app and removes it. An expired key can still start
            that sign-in for 30 days after this time, and claiming the app within those
            30 days makes the key work again.
    AppContext:
      type: object
      description: Who is calling, as worked out from the API key.
      required: [account, app, api_key, livemode]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        app:
          $ref: "#/components/schemas/App"
        api_key:
          $ref: "#/components/schemas/ApiKey"
        livemode:
          type: boolean
          description: "`true` for a live key, `false` for a test key."
        allowance:
          $ref: "#/components/schemas/SandboxAllowance"

    # ---------------------------------------------------------------- onboarding
    SandboxAllowance:
      type: object
      description: |
        What the app may still send on the shared sandbox senders for free. Present
        only on apps that have one: apps made with `POST /v1/sandbox/keys`
        (`anonymous`, one allowance per app), and apps of people who signed in
        (`signed_in`, one allowance per person: every app the person owns or claimed
        draws on the same contacts and messages, so the counts here are the
        person's, over all those apps). Only messages your agent sends count, on the
        channels in `channels`; inbound messages are free. A contact counts once it
        joins an app on a sandbox sender, and keeps counting after it leaves. Sends
        past the allowance answer `403 permission` with `channel_code`
        `sandbox_allowance_used`; a join past `contacts.limit` is refused in the
        chat.
      required: [tier, scope, channels, contacts, messages_per_contact, messages, upgrade]
      properties:
        tier:
          type: string
          description: "`anonymous`: an app made without an account, whose keys expire. `signed_in`: an app of a person who signed in (with a Flow account)."
          enum: [anonymous, signed_in]
        scope:
          type: string
          description: |
            Who the counts belong to. `app`: this app alone (`anonymous`). `person`:
            the signed-in person, shared by every app they own or claimed, so sends
            from their other apps use the same contacts and messages.
          enum: [app, person]
        channels:
          type: array
          description: The sandbox channels the allowance covers whose shared sandbox is open now (Telegram today; WhatsApp when its sandbox opens). Shared senders of other channels (iMessage) are not part of it and refuse its sends.
          items:
            $ref: "#/components/schemas/Channel"
        contacts:
          $ref: "#/components/schemas/AllowanceCount"
        messages_per_contact:
          type: integer
          minimum: 0
          description: How many messages may be sent to each contact (50 anonymous, so 50 in total; 100 signed in).
        messages:
          $ref: "#/components/schemas/AllowanceMessages"
        expires_at:
          type: string
          format: date-time
          description: "`anonymous` only: when the app's keys expire. Signing in removes it."
        upgrade:
          type: string
          description: One sentence saying how to raise the allowance, for example by signing in with `npx @flow-engineer/messaging login`.
    AllowanceCount:
      type: object
      description: Contacts the allowance has room for, and how many have joined (with `scope` `person`, over all the person's apps).
      required: [limit, used]
      properties:
        limit:
          type: integer
          minimum: 0
          description: How many contacts may join on the sandbox (1 for an anonymous app; 3 for a signed-in person, over all their apps).
        used:
          type: integer
          minimum: 0
          description: How many have joined so far.
    AllowanceMessages:
      type: object
      description: Messages sent against the allowance, over all its contacts (with `scope` `person`, from all the person's apps).
      required: [limit, used, remaining]
      properties:
        limit:
          type: integer
          minimum: 0
          description: "`contacts.limit` times `messages_per_contact`."
        used:
          type: integer
          minimum: 0
          description: Messages sent so far on the allowance's sandbox senders.
        remaining:
          type: integer
          minimum: 0
          description: Messages still allowed, counting each contact's own cap and the contacts that may still join.
    SandboxKeyRequest:
      type: object
      description: Optional details for a new sandbox app.
      properties:
        name:
          type: string
          maxLength: 80
          description: The app's name, shown in the dashboard once it is claimed. Defaults to "Sandbox app".
    SandboxKey:
      type: object
      description: A new app made without an account, with its test key. `key` and `claim_token` are shown only here.
      required: [key, api_key, account, app, allowance, claim_token, claim_url, senders]
      properties:
        key:
          type: string
          description: The API key itself (`fk_test_...`). Shown once; store it as `FLOW_MESSAGING_KEY`.
          examples: ["fk_test_..."]
        api_key:
          $ref: "#/components/schemas/ApiKey"
        account:
          $ref: "#/components/schemas/Account"
        app:
          $ref: "#/components/schemas/App"
        allowance:
          $ref: "#/components/schemas/SandboxAllowance"
        claim_token:
          type: string
          description: |
            Proves you hold this app when a person signs in to claim it: pass it to
            `POST /v1/device/authorizations`. Shown once; keep it with the key. It
            stops working once the app is claimed.
          examples: ["fct_..."]
        claim_url:
          type: string
          format: uri
          description: A page where a person signs in to Flow and claims the app in the browser, without the CLI. It holds the claim token, so treat it like one. The claim hands out no key and revokes the app's keys unless the person ticks "Keep my agent's current key working"; afterwards they make keys on the dashboard's Keys page.
          examples: ["https://api.flow.engineer/admin/claim#token=fct_..."]
        senders:
          type: array
          description: The shared sandbox senders the key can use, each with the link a person opens to join the app (`address.link`) and the join message (`join_code`).
          items:
            $ref: "#/components/schemas/Sender"
    DeviceAuthorizationRequest:
      type: object
      description: Optional details for a device sign-in.
      properties:
        claim_token:
          type: string
          description: The `claim_token` from `POST /v1/sandbox/keys`, to claim that app when the person approves.
        client_name:
          type: string
          maxLength: 80
          description: What is asking, shown to the person on the approval page, for example "flow CLI" or "Claude Code".
    DeviceAuthorization:
      type: object
      description: A device sign-in waiting for a person to approve it in a browser.
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, expires_at, interval]
      properties:
        device_code:
          type: string
          description: The secret you poll `POST /v1/device/token` with. Never show it to the person.
          examples: ["fdc_..."]
        user_code:
          type: string
          description: The code the person types on the approval page, eight letters in two groups. Always show it to the person, also when you show `verification_uri_complete`.
          examples: ["WDJB-MJHT"]
        verification_uri:
          type: string
          format: uri
          description: The page where the person signs in and enters `user_code`.
          examples: ["https://api.flow.engineer/admin/device"]
        verification_uri_complete:
          type: string
          format: uri
          description: The same page for this sign-in. Show this link (or a QR code of it) to the person together with `user_code`; the page asks them to type the code they see from you and checks it against the link, so a link on its own cannot approve a sign-in.
          examples: ["https://api.flow.engineer/admin/device?code=WDJB-MJHT"]
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the codes expire (15 minutes).
        expires_at:
          type: string
          format: date-time
          description: When the codes expire.
        interval:
          type: integer
          minimum: 1
          description: Seconds to wait between polls of `POST /v1/device/token`.
    DeviceTokenRequest:
      type: object
      description: The device sign-in to poll.
      required: [device_code]
      properties:
        device_code:
          type: string
          description: The `device_code` from `POST /v1/device/authorizations`.
    DeviceToken:
      type: object
      description: |
        A device sign-in's state. With `approved`, it carries a new test key (shown
        once), the app it belongs to and whether a sandbox app was claimed.
      required: [status, interval]
      properties:
        status:
          type: string
          description: |
            - `pending`: the person has not finished; poll again after `interval` seconds.
            - `approved`: signed in; `key` is set. The device code is now used up.
            - `denied`: the person refused. Stop polling.
            - `expired`: the codes ran out or were already used. Start again.
          enum: [pending, approved, denied, expired]
        interval:
          type: integer
          minimum: 1
          description: Seconds to wait before the next poll.
        key:
          type: string
          description: "`approved` only. A new API key (`fk_test_...`), shown once; store it as `FLOW_MESSAGING_KEY` in place of the sandbox key. When the sign-in claimed a sandbox app, that app's sandbox keys stop working as this key is handed out."
        api_key:
          $ref: "#/components/schemas/ApiKey"
        account:
          $ref: "#/components/schemas/Account"
        app:
          $ref: "#/components/schemas/App"
        claimed:
          type: boolean
          description: "`approved` only. `true` when the sign-in claimed the app of the `claim_token` or key it was started with."
        allowance:
          $ref: "#/components/schemas/SandboxAllowance"
        user:
          $ref: "#/components/schemas/SignedInUser"
    SignedInUser:
      type: object
      description: The person who approved a device sign-in.
      required: [name, provider]
      properties:
        name:
          type: string
          description: Their name or login at the provider.
        email:
          type: string
          format: email
          description: Their verified email address, where the provider gave one.
        provider:
          type: string
          description: |
            Where they signed in: `flow` (a Flow account, flow.engineer: every sign-in
            today). `github` and `google` are sign-ins made on the Messaging API itself
            before Flow accounts. More may be added later, so treat a value you do not
            know as a sign-in elsewhere rather than an error.
          enum: [flow, github, google]

    # ---------------------------------------------------------------- senders
    Sender:
      type: object
      description: |
        What your agent talks from: a Telegram bot, a WhatsApp number, an iMessage
        line or a US SMS number. `shared` senders are Flow's sandbox, used by many apps in test mode;
        `dedicated` senders are yours alone; `simulated` senders exist only in test
        mode, for simulated conversations. Each sender has its own limits and warm-up
        state.
      required: [id, channel, kind, livemode, status, address, limits, created_at]
      properties:
        id:
          $ref: "#/components/schemas/SenderId"
        channel:
          $ref: "#/components/schemas/Channel"
        kind:
          $ref: "#/components/schemas/SenderKind"
        livemode:
          type: boolean
          description: "`false` for sandbox and simulated senders, `true` for dedicated senders used in live mode."
        display_name:
          type: string
          description: The name contacts see, where the channel shows one.
        status:
          $ref: "#/components/schemas/SenderStatus"
        throttled_until:
          type: string
          format: date-time
          description: With status `throttled`, when starts are allowed again. Recovery is automatic.
        address:
          $ref: "#/components/schemas/SenderAddress"
        limits:
          $ref: "#/components/schemas/SenderLimits"
        quality_rating:
          type: string
          description: WhatsApp only. Meta's quality rating for the number.
          enum: [green, yellow, red, unknown]
        sms:
          $ref: "#/components/schemas/SmsSender"
        setup:
          $ref: "#/components/schemas/SenderSetup"
        join_code:
          type: string
          description: |
            Shared senders only. The whole message a contact sends to this sender to join your app: `join `, a space, then the app's `sandbox_join_code` (from `GET /v1/app`), for example `join brave-otter-40718263`. Show it to testers as is.
          examples: ["join brave-otter-40718263"]
        created_at:
          type: string
          format: date-time
          description: When the sender was created.
    SenderSetup:
      type: object
      readOnly: true
      description: |
        Only in the answer to `POST /v1/senders` that connected a WhatsApp number:
        what you still set in your own Meta app, which Flow cannot set for you.
        Flow already points the number's webhooks at `callback_url` (Meta's
        phone-number-level override); entering the same URL in your app makes its
        field subscriptions apply. The verify token is shown only in this answer
        (connecting the number again shows it again); keep it like a password.
      required: [callback_url, verify_token, webhook_fields, steps]
      properties:
        callback_url:
          type: string
          format: uri
          description: The callback URL to enter in your Meta app (App Dashboard > WhatsApp > Configuration > Webhook).
          examples: ["https://api.flow.engineer/ingress/whatsapp/snd_01J9ZK3N5B6VQ1M2X4C7R8T9WA"]
        verify_token:
          type: string
          description: The verify token to enter with the callback URL.
        webhook_fields:
          type: array
          description: The webhook fields to subscribe in the same place.
          items:
            type: string
          examples: [["messages", "message_template_status_update", "phone_number_quality_update", "account_update", "business_capability_update", "template_category_update", "account_alerts"]]
        steps:
          type: array
          description: The steps in your Meta app, in order, as plain sentences to show a person.
          items:
            type: string
    SmsSender:
      type: object
      readOnly: true
      description: |
        SMS senders only: how the number is registered with US carriers and what it
        can do. An SMS number stays `pending` until its registration is approved
        (carriers block traffic from unregistered numbers).
      required: [number_type, registration_status, two_way, mms]
      properties:
        number_type:
          type: string
          description: "`10dlc` (a local 10-digit number, registered as a brand and campaign) or `toll_free` (a verified toll-free number)."
          enum: [10dlc, toll_free]
        registration_status:
          type: string
          description: |
            The number's carrier registration (the 10DLC campaign, or toll-free
            verification): `pending` (submitted, not approved yet; the sender is
            `pending` and sends nothing), `approved`, or `rejected` (the sender is
            `flagged`; the Flow team resubmits).
          enum: [pending, approved, rejected]
        two_way:
          type: boolean
          description: Whether the number receives texts. Always `true` for senders Flow connects today.
        mms:
          type: boolean
          description: Whether the number sends and receives MMS (images, audio and video). Without it, `media` and `voice` sends answer `422 unsupported_content`.
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
    QuietHours:
      type: object
      description: |
        The hours, in the contact's local time zone (worked out from their area
        code; when it is not known, every US time zone must be outside the
        hours), in which the sender does not message contacts who have not texted
        it in the last hour. Absent when the sender has no quiet hours. A send
        inside them answers `409 outside_window` with `channel_code` `quiet_hours`
        and `retry_after`; a message that waited in the queue into them is held
        until they end. Replies to a contact who texted within the hour always
        go.
      required: [start, end]
      properties:
        start:
          type: string
          description: When the quiet hours begin, `HH:MM` on a 24-hour clock.
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["21:00"]
        end:
          type: string
          description: When they end, `HH:MM` on a 24-hour clock (earlier than `start` when they span midnight).
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["08:00"]
    SenderKind:
      type: string
      description: |
        `shared` (the sandbox), `dedicated` (yours) or `simulated` (test mode only:
        your app's stand-in for a channel, used by simulated conversations from
        `POST /v1/test/conversations`; it never touches a network).
      enum: [shared, dedicated, simulated]
    SenderStatus:
      type: string
      description: |
        - `pending`: requested, being provisioned.
        - `active`: sending normally.
        - `warming_up`: active, with a new-contact budget that grows day by day.
        - `throttled`: the gate slowed it after an abuse signal; it recovers by itself.
        - `flagged`: the channel or Flow flagged it; starts are paused. A Telegram
          bot is also `flagged` when Telegram rejects its token (revoked in
          @BotFather): it then sends nothing, new sends answer `403 permission`, and
          queued messages wait until you connect the bot again with its new token
          (`POST /v1/senders`). They wait at most 72 hours after Flow accepted
          them; older ones fail with `outside_window` (`channel_code`
          `queued_too_long`) in `message.failed` instead of going out late.
        - `banned`: it cannot send or receive: the channel banned it, you
          disconnected it (`DELETE /v1/senders/{sender_id}`), or its bot or line was
          connected to another app.
      enum: [pending, active, warming_up, throttled, flagged, banned]
    SenderAddress:
      type: object
      description: How contacts reach the sender. Which fields are set depends on the channel.
      properties:
        phone:
          type: string
          description: WhatsApp, iMessage and SMS. E.164 phone number.
        username:
          type: string
          description: Telegram. The bot's username, without `@`.
        handle:
          type: string
          description: iMessage. The line's handle (phone number or email address).
        link:
          type: string
          format: uri
          description: |
            A link that opens a chat with the sender: `https://t.me/...` for a Telegram
            bot, `https://wa.me/...` for a WhatsApp number. For an iMessage line it is
            the line's opt-in link, which opens Messages with the line and a prefilled
            text the person sends to start the conversation; it is set only when the
            line has one configured.
    SenderLimits:
      type: object
      description: The sender's current budget for starting conversations, and how fast it sends.
      required: [new_contacts_per_day, new_contacts_per_hour]
      properties:
        new_contacts_per_day:
          type: integer
          description: New conversations the sender may start per day today (grows during warm-up).
        new_contacts_per_hour:
          type: integer
          description: New conversations the sender may start per hour.
        messages_per_second:
          type: number
          description: |
            The sender's pacing: how many messages a second it takes on average,
            replies included, with short bursts allowed above it. A send past it
            answers `429 rate_limited` with `retry_after`. A shared sandbox
            sender's pacing is shared by every app that uses it. Absent for
            simulated senders, which are not paced.
          examples: [1]
        whatsapp_tier:
          type: string
          description: WhatsApp only. Meta's messaging tier for the number.
    SenderRequest:
      type: object
      description: A request for a dedicated sender.
      required: [channel]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        display_name:
          type: string
          maxLength: 64
          description: The name contacts should see.
        country:
          type: string
          description: WhatsApp and iMessage. ISO 3166-1 alpha-2 country for the number, for example `IN`.
          pattern: "^[A-Z]{2}$"
        telegram_bot_token:
          type: string
          writeOnly: true
          maxLength: 128
          pattern: "^[0-9]{1,20}:[A-Za-z0-9_-]{20,100}$"
          description: Telegram only, and required there. The bot token from BotFather. Stored encrypted; never returned.
        whatsapp_phone_number_id:
          type: string
          maxLength: 32
          pattern: "^[0-9]{1,32}$"
          description: WhatsApp only, and required there. The phone number ID of your number (WhatsApp Manager, or App Dashboard > WhatsApp > API Setup), not the phone number itself.
          examples: ["106540352242922"]
        whatsapp_business_account_id:
          type: string
          maxLength: 32
          pattern: "^[0-9]{1,32}$"
          description: WhatsApp only, and required there. The ID of the WhatsApp Business Account the number is in.
          examples: ["102290129340398"]
        whatsapp_access_token:
          type: string
          writeOnly: true
          maxLength: 2048
          description: |
            WhatsApp only, and required there. A system user access token of your
            business (it starts with `EAA`) that never expires, with
            `whatsapp_business_messaging` and `whatsapp_business_management`, and
            your WhatsApp Business Account and Meta app assigned to the system
            user. Stored encrypted; never returned.
        whatsapp_app_secret:
          type: string
          writeOnly: true
          maxLength: 64
          description: WhatsApp only, and required there. The App secret of your Meta app (App settings > Basic, 32 hexadecimal characters); Meta signs the number's webhooks with it. Stored encrypted; never returned.
        whatsapp_registration_pin:
          type: string
          writeOnly: true
          pattern: "^[0-9]{6}$"
          description: |
            WhatsApp only, optional. Give it only when the number is not registered
            for the Cloud API yet: Flow registers the number with this six-digit
            two-step verification PIN (the number's current PIN, if it has one).
            Meta allows 10 registrations per number in 72 hours. Stored encrypted;
            never returned.
    SenderList:
      type: object
      description: A page of senders.
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Sender"
        has_more:
          type: boolean
          description: Whether more items lie beyond this page in the direction you paged.

    # ---------------------------------------------------------------- contacts
    Contact:
      type: object
      description: A person on one channel. There is no cross-channel identity, and a contact may have no phone number at all (a Telegram user, a WhatsApp username, an iMessage email handle).
      required: [id, channel, livemode, address, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ContactId"
        channel:
          $ref: "#/components/schemas/Channel"
        livemode:
          type: boolean
          description: Whether the contact belongs to live mode.
        address:
          $ref: "#/components/schemas/ContactAddress"
        name:
          type: string
          description: The contact's display name, as the channel reports it. May change or be missing.
        opted_out_at:
          type: string
          format: date-time
          readOnly: true
          description: |
            SMS. When the contact opted out of your app's SMS messages. Absent when
            they have not, or texted START (or UNSTOP, YES) since to a number they
            opted out through (START to another of your numbers does not lift it,
            since carriers and providers block per number). While it is set, sends
            to them on every SMS sender of your app answer `403 permission` with
            `channel_code` `contact_opted_out`. Every opt-out, opt-in and recorded
            consent is kept in the contact's history.
        opted_out_via:
          type: string
          readOnly: true
          description: |
            SMS. How the contact opted out: `keyword` (they texted STOP or one of
            its variants) or `carrier` (the carrier or provider reported the number
            unsubscribed when Flow sent to it). Set with `opted_out_at`.
          enum: [keyword, carrier]
        consent:
          $ref: "#/components/schemas/ContactConsent"
        simulated:
          type: boolean
          readOnly: true
          description: "`true` for a simulated contact, who exists only inside Flow (test mode only, from `POST /v1/test/conversations`); absent otherwise."
        created_at:
          type: string
          format: date-time
          description: When Flow first saw the contact.
    ContactAddress:
      type: object
      description: How the contact is reached on their channel. Which fields are set depends on the channel; do not assume `phone`.
      properties:
        phone:
          type: string
          description: E.164 phone number (WhatsApp and SMS; iMessage when the handle is a number).
        username:
          type: string
          description: A username without `@` (Telegram, WhatsApp usernames).
        telegram_user_id:
          type: string
          description: Telegram's numeric user ID, as a string.
        handle:
          type: string
          description: iMessage handle (a phone number or an email address).
    Consent:
      type: object
      description: |
        The contact's consent to receive messages from you, as you recorded it
        before starting the conversation. Required to start an SMS conversation
        with someone who has never texted your numbers (US law, the TCPA, needs
        their prior express consent). Flow keeps it on the contact. It does not
        undo an opt-out: only the contact texting START does.
      required: [obtained_at, method]
      properties:
        obtained_at:
          type: string
          format: date-time
          description: When the person gave consent. Not in the future.
        method:
          type: string
          description: How they gave it.
          enum: [web_form, paper_form, verbal, text_message, app, other]
        proof:
          type: string
          maxLength: 500
          description: Your own reference to the record of consent (a form submission ID or URL). Do not put health information here.
    ContactConsent:
      readOnly: true
      description: SMS. The consent recorded with the latest start to this contact that carried one. Absent when none was recorded.
      allOf:
        - $ref: "#/components/schemas/Consent"
        - type: object
          required: [recorded_at]
          properties:
            recorded_at:
              type: string
              format: date-time
              description: When Flow recorded it.
    ContactList:
      type: object
      description: A page of contacts.
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        has_more:
          type: boolean
          description: Whether more items lie beyond this page in the direction you paged.
    Recipient:
      type: object
      description: |
        Who to start a conversation with: an existing `contact`, or an address on the
        sender's channel. Give exactly one field.
      minProperties: 1
      maxProperties: 1
      properties:
        contact:
          $ref: "#/components/schemas/ContactId"
        phone:
          type: string
          description: WhatsApp, iMessage or SMS. E.164 phone number; on SMS a US or Canadian number, `+1` and ten digits.
          pattern: "^\\+[1-9][0-9]{6,14}$"
        telegram_user_id:
          type: string
          description: Telegram. The user's numeric ID; they must have started the bot.
        handle:
          type: string
          description: iMessage. A phone number or an email address.

    # ---------------------------------------------------------------- conversations
    Conversation:
      type: object
      description: One sender talking with one contact. Holds the window state and whether the contact opted in.
      required: [id, app, channel, sender, contact, livemode, opted_in, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ConversationId"
        app:
          $ref: "#/components/schemas/AppId"
        channel:
          $ref: "#/components/schemas/Channel"
        sender:
          $ref: "#/components/schemas/SenderId"
        contact:
          $ref: "#/components/schemas/ContactId"
        livemode:
          type: boolean
          description: Whether the conversation belongs to live mode.
        last_inbound_at:
          type: string
          format: date-time
          description: When the contact last wrote. Absent if they never have.
        window_open_until:
          type: string
          format: date-time
          description: WhatsApp only. Until when free-form messages may be sent; after it, only templates. Absent when the window is closed or the channel has none.
        opted_in:
          type: boolean
          description: Whether the contact has agreed to receive messages (wrote first, joined the sandbox, or you recorded consent).
        simulated:
          type: boolean
          readOnly: true
          description: "`true` for a simulated conversation, whose contact exists only inside Flow (test mode only, from `POST /v1/test/conversations`); absent otherwise."
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          type: string
          format: date-time
          description: When the conversation began.
    ConversationRef:
      type: object
      description: The conversation an event happened in, inlined so most handlers need no extra call.
      required: [id, channel, sender, contact]
      properties:
        id:
          $ref: "#/components/schemas/ConversationId"
        channel:
          $ref: "#/components/schemas/Channel"
        sender:
          $ref: "#/components/schemas/SenderId"
        contact:
          $ref: "#/components/schemas/ContactId"
        window_open_until:
          type: string
          format: date-time
          description: WhatsApp only. Until when free-form messages may be sent. Absent when closed or not applicable.
        simulated:
          type: boolean
          readOnly: true
          description: "`true` for a simulated conversation, whose contact exists only inside Flow (test mode only, from `POST /v1/test/conversations`); absent otherwise."
    ConversationList:
      type: object
      description: A page of conversations.
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        has_more:
          type: boolean
          description: Whether more items lie beyond this page in the direction you paged.
    ConversationAction:
      type: object
      description: The result of a typing or read call.
      required: [conversation, action]
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationId"
        action:
          type: string
          description: Which action was taken.
          enum: [typing_on, typing_off, read]
        delivered_as:
          $ref: "#/components/schemas/DeliveredAs"
    TypingRequest:
      type: object
      description: Turn the typing indicator on or off.
      required: [state]
      properties:
        state:
          type: string
          description: "`on` shows the indicator, `off` clears it."
          enum: ["on", "off"]
    ReadRequest:
      type: object
      description: Which messages to mark as read.
      properties:
        up_to:
          $ref: "#/components/schemas/MessageId"
          description: The latest inbound message to mark read (default the latest inbound message). On iMessage it has no effect, since the whole conversation is marked read.

    # ---------------------------------------------------------------- messages
    Message:
      type: object
      description: One message in or out of a conversation, with its typed content and delivery status.
      required: [id, conversation, direction, status, content, livemode, created_at]
      properties:
        id:
          $ref: "#/components/schemas/MessageId"
        conversation:
          $ref: "#/components/schemas/ConversationId"
        direction:
          $ref: "#/components/schemas/MessageDirection"
        status:
          $ref: "#/components/schemas/MessageStatus"
        content:
          $ref: "#/components/schemas/Content"
        delivered_as:
          $ref: "#/components/schemas/DeliveredAs"
        error:
          $ref: "#/components/schemas/ErrorBody"
        channel_message_id:
          type: string
          description: The channel's own ID for the message, once the channel accepted it.
        sms:
          $ref: "#/components/schemas/SmsSegments"
        reply_to:
          $ref: "#/components/schemas/MessageId"
          readOnly: true
          description: |
            The Flow ID of the message this one replies to. For a sent message, the
            message the send named in `reply_to`. For a received message, the message it
            replies to inline (a Telegram reply; on iMessage, the thread's root message).
            Absent when the message is not a reply or the quoted message is not known
            to Flow.
        livemode:
          type: boolean
          description: Whether the message belongs to live mode.
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          type: string
          format: date-time
          description: When Flow received (inbound) or accepted (outbound) the message.
        updated_at:
          type: string
          format: date-time
          description: When the status last changed.
    SmsSegments:
      type: object
      readOnly: true
      description: |
        SMS text messages only: how the text travels as SMS. Carriers bill and
        deliver SMS in segments: 160 GSM-7 characters fit one segment (153 each
        when split), but a single character outside GSM-7 (an emoji, curly quotes,
        most non-Latin letters) makes the whole text UCS-2, 70 characters in one
        segment (67 each when split). An SMS send may use at most `max_sms_segments`
        (`GET /v1/capabilities`, 10). Absent on MMS and on other channels.
      required: [segments, encoding]
      properties:
        segments:
          type: integer
          minimum: 1
          description: How many SMS segments the text takes.
        encoding:
          type: string
          description: "`gsm7` or `ucs2`."
          enum: [gsm7, ucs2]
    MessageDirection:
      type: string
      description: "`in` from the contact, `out` from your app."
      enum: [in, out]
    MessageStatus:
      type: string
      description: |
        - `received`: inbound from the contact.
        - `queued`: accepted by the gate, waiting for its turn in the conversation.
        - `sent`: the channel accepted it.
        - `delivered`: it reached the contact's device, where the channel reports this.
        - `read`: the contact read it, where the channel reports this.
        - `failed`: it could not be sent; see `error`.
        - `unsent`: you unsent it.
      enum: [received, queued, sent, delivered, read, failed, unsent]
    DeliveredAs:
      type: object
      description: |
        Present when what the contact sees differs from what you sent: the `fallback`
        was used, or the action was skipped because the channel has no equivalent.
        Absent when the content was shown as sent.
      required: [type, reason]
      properties:
        type:
          type: string
          description: The content type actually shown, or `none` when nothing was shown.
          enum: [text, media, voice, buttons, carousel, reaction, template, location, contact_card, effect, typing, read, edit, unsend, none]
        reason:
          type: string
          description: Why, in one sentence (for example "iMessage cannot show buttons; sent numbered text").
    MessageList:
      type: object
      description: A page of messages.
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        has_more:
          type: boolean
          description: Whether more items lie beyond this page in the direction you paged.
    Fallback:
      description: |
        What to send when the channel cannot show `content`. Without it, such a send
        fails with `unsupported_content`; nothing is converted silently.

        - `"auto"`: use the documented default for the content type (markdown becomes
          plain text, buttons become numbered text whose replies are matched back to
          the button IDs, a carousel becomes its text and then one message per card,
          a voice note becomes an audio file, a location becomes a
          maps link, a contact card becomes text, an effect becomes plain text, a
          reaction becomes the closest tapback or is skipped).
        - A `Content` object: send exactly this instead.
        - `null`: no fallback, the same as leaving it out.

        The message's `delivered_as` reports what was used.
      oneOf:
        - $ref: "#/components/schemas/FallbackAuto"
        - $ref: "#/components/schemas/Content"
        - type: "null"
    FallbackAuto:
      type: string
      description: Use the content type's default fallback.
      enum: [auto]
    ChannelOptions:
      type: object
      description: |
        **Unstable escape hatch.** Extra channel parameters for how a message looks
        and notifies, for example `{"parse_mode": "HTML"}` on Telegram. Each channel
        has an allowlist: keys not on it are dropped, never passed to the channel, and
        the typed request always wins over a key that sets the same thing. Who
        receives the message and what it says always come from the typed request.
        Keys starting with `_flow_` are reserved and refused with `invalid_request`.
        Flow does not validate the values, and they may break when a channel
        changes. Prefer typed content.

        - **Telegram** (Bot API parameters, on every send): `parse_mode`,
          `entities`, `caption_entities`, `link_preview_options`,
          `disable_web_page_preview`, `show_caption_above_media`,
          `disable_notification`, `protect_content`, `allow_paid_broadcast`,
          `message_effect_id`, `has_spoiler`, `supports_streaming`, `duration`,
          `width`, `height`, `performer`, `horizontal_accuracy`, `foursquare_id`,
          `foursquare_type`, `google_place_id`, `google_place_type`, `vcard`,
          `is_big` (reactions).
        - **iMessage**: on messages, `subject`, `effect`, `preview`,
          `reply_to_id` and `contact_file`; on `typing` content, `typing` (how long
          to show it, 1 to 60 seconds). Reactions, read receipts, edits and unsends
          take none.
        - **WhatsApp**: on `text` content, `preview_url` (show a link preview;
          by default on when the text holds an http(s) link). Everything else
          (recipient, message type, reply context) comes from the typed fields.
      examples:
        - {parse_mode: HTML, disable_notification: true}
      additionalProperties: true
    SendMessageRequest:
      type: object
      description: |
        One piece of content to send into a conversation. A field not listed here is
        refused with `400 invalid_request` naming it in `param`, never ignored. There
        are no scheduled sends: a message goes out as soon as it passes the gate, so
        to send later, wait in your own code and send then.
      required: [content]
      additionalProperties: false
      properties:
        content:
          $ref: "#/components/schemas/Content"
        reply_to:
          $ref: "#/components/schemas/MessageId"
          description: |
            Send this as a reply to an earlier message in the same conversation.
            Telegram and iMessage show it as an inline reply; channels without inline
            replies send it as a normal message. Refused with `not_found` (`param`
            `reply_to`) when the target is not a message in this conversation, and with
            `invalid_request` (`param` `reply_to`) when the content is `typing`, `read`,
            `reaction`, `edit` or `unsend`, or when the target never reached the
            channel (for example, it failed). If the target fails after the send was
            accepted, the reply goes out as a normal message.
        fallback:
          $ref: "#/components/schemas/Fallback"
        channel_options:
          $ref: "#/components/schemas/ChannelOptions"
        metadata:
          $ref: "#/components/schemas/Metadata"
    StartConversationRequest:
      type: object
      description: |
        The first message from one of your senders to a contact. A field not listed
        here is refused with `400 invalid_request` naming it in `param`, never
        ignored. There are no scheduled sends: to start a conversation later, wait
        in your own code and send then.
      required: [sender, to, content]
      additionalProperties: false
      properties:
        sender:
          $ref: "#/components/schemas/SenderId"
        to:
          $ref: "#/components/schemas/Recipient"
        content:
          $ref: "#/components/schemas/Content"
        fallback:
          $ref: "#/components/schemas/Fallback"
        channel_options:
          $ref: "#/components/schemas/ChannelOptions"
        metadata:
          $ref: "#/components/schemas/Metadata"
        consent:
          $ref: "#/components/schemas/Consent"
          description: SMS. The contact's consent, required when they have never texted any of your SMS numbers; recorded on the contact. Ignored on other channels.
    EditMessageRequest:
      type: object
      description: The new text of a sent message. A field not listed here is refused with `400 invalid_request` naming it in `param`.
      required: [content]
      additionalProperties: false
      properties:
        content:
          $ref: "#/components/schemas/TextContent"

    # ---------------------------------------------------------------- content
    ContentType:
      type: string
      description: The kinds of content. Each is described in its own schema, with the direction it travels in.
      enum: [text, media, voice, buttons, button_reply, carousel, reaction, template, location, contact_card, effect, typing, read, edit, unsend, file_blocked]
    Content:
      type: object
      description: |
        One piece of content, in either direction. `type` selects the shape. Inbound
        messages use `text`, `media`, `voice`, `button_reply`, `reaction`, `location`,
        `contact_card` and `file_blocked`; sends use every type except `button_reply`
        and `file_blocked`.

        A buttons message may carry a `header` (`ContentHeader`): an image, video,
        document or a short title shown with the text and buttons.

        | type | Telegram | WhatsApp | iMessage | SMS (US, pilot) | `fallback: "auto"` |
        |---|---|---|---|---|---|
        | text | yes | yes | yes | yes (at most 10 segments) | markdown to plain |
        | media | yes | yes | yes | images, audio, video as MMS (no documents) | none |
        | voice | yes | yes | yes | as an MMS audio file | audio file |
        | buttons | inline keyboard | up to 3 buttons, else a list; one URL button as a call-to-action link | no | no | numbered text |
        | buttons with a media `header` | one message: the media, the text as its caption (1024), the keyboard | the header of the same message (not with a list) | no | no | the media, then numbered text |
        | buttons with a text `header` | a bold first line | the header of the same message | no | no | a first line of the numbered text |
        | carousel | no | yes (2 to 10 cards) | no | no | the text, then each card as its own message |
        | reaction | yes | yes | tapbacks, other emoji as emoji reactions | no | closest tapback, else skipped (SMS: none) |
        | template | no | yes | no | no | none |
        | location | yes | yes | no | no | maps link as text |
        | contact_card | yes | yes | no | no | text |
        | effect | no | no | yes | no | plain text |
        | typing | yes | yes | yes (within 5 minutes of the contact's last message) | no | skipped |
        | read | no (bots) | yes | yes (the whole conversation) | no | skipped |
        | edit | yes | no | yes (within 15 minutes) | no | none |
        | unsend | yes (within 48 hours) | no | yes (within 2 minutes) | no | none |
      oneOf:
        - $ref: "#/components/schemas/TextContent"
        - $ref: "#/components/schemas/MediaContent"
        - $ref: "#/components/schemas/VoiceContent"
        - $ref: "#/components/schemas/ButtonsContent"
        - $ref: "#/components/schemas/ButtonReplyContent"
        - $ref: "#/components/schemas/CarouselContent"
        - $ref: "#/components/schemas/ReactionContent"
        - $ref: "#/components/schemas/TemplateContent"
        - $ref: "#/components/schemas/LocationContent"
        - $ref: "#/components/schemas/ContactCardContent"
        - $ref: "#/components/schemas/EffectContent"
        - $ref: "#/components/schemas/TypingContent"
        - $ref: "#/components/schemas/ReadContent"
        - $ref: "#/components/schemas/EditContent"
        - $ref: "#/components/schemas/UnsendContent"
        - $ref: "#/components/schemas/FileBlockedContent"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextContent"
          media: "#/components/schemas/MediaContent"
          voice: "#/components/schemas/VoiceContent"
          buttons: "#/components/schemas/ButtonsContent"
          button_reply: "#/components/schemas/ButtonReplyContent"
          carousel: "#/components/schemas/CarouselContent"
          reaction: "#/components/schemas/ReactionContent"
          template: "#/components/schemas/TemplateContent"
          location: "#/components/schemas/LocationContent"
          contact_card: "#/components/schemas/ContactCardContent"
          effect: "#/components/schemas/EffectContent"
          typing: "#/components/schemas/TypingContent"
          read: "#/components/schemas/ReadContent"
          edit: "#/components/schemas/EditContent"
          unsend: "#/components/schemas/UnsendContent"
          file_blocked: "#/components/schemas/FileBlockedContent"
    TextContent:
      type: object
      description: Text, both ways. With `format` `markdown`, Flow renders it in each channel's own formatting; a channel without formatting needs `fallback`.
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
          description: Always `text`.
        text:
          type: string
          minLength: 1
          maxLength: 9999
          description: The text, at most the channel's `max_text_length` characters (4096 on Telegram and WhatsApp, 9999 on iMessage, 1530 on SMS, where it must also fit in 10 segments, 670 characters when it holds an emoji or other character outside GSM-7; see `GET /v1/capabilities`). Telegram counts UTF-16 code units of the text as shown (after markdown), so an emoji such as 😀 counts as 2. In an edit of a media message the text replaces its caption, and the caption limit applies (1024). Longer text is refused with `invalid_request`.
        format:
          type: string
          enum: [plain, markdown]
          default: plain
          description: How to read `text`. `markdown` is CommonMark (`**bold**`, `*italic*`); Flow converts it to each channel's marks. `plain` is sent as written, so a channel's own marks (WhatsApp's `*bold*`) work with `plain`. Inbound text is always `plain`.
    MediaContent:
      type: object
      description: |
        An image, video, document or audio file, both ways. When sending, give either
        `url` (Flow fetches it) or `file_id` (from `POST /v1/files`). Inbound media
        always has `url`, a Flow file URL (`GET /v1/files/{file_id}`), and `file_id`,
        on every channel (an SMS contact's MMS files included), and `mime_type` and
        `size_bytes` once Flow kept the file. On SMS Flow always keeps its own copy
        (the provider's is deleted): an MMS file it could not fetch or check arrives
        as `file_blocked` instead. Send a received file again by its `file_id`.
      required: [type, kind]
      properties:
        type:
          type: string
          enum: [media]
          description: Always `media`.
        kind:
          type: string
          enum: [image, video, document, audio]
          description: What kind of media it is.
        url:
          type: string
          format: uri
          description: Where the bytes are. Sending, an HTTPS URL Flow can fetch; inbound, a Flow file URL.
        file_id:
          $ref: "#/components/schemas/FileId"
        caption:
          type: string
          maxLength: 1024
          description: Text shown with the media, at most 1024 characters. Telegram counts UTF-16 code units, so an emoji such as 😀 counts as 2. Longer captions are refused with `invalid_request`.
        filename:
          type: string
          maxLength: 255
          description: The file's name, shown for documents.
        mime_type:
          type: string
          readOnly: true
          description: The real type, checked from the file's first bytes.
        size_bytes:
          type: integer
          readOnly: true
          description: The file's size.
    VoiceContent:
      type: object
      description: |
        A voice note, both ways. Inbound voice notes always come with the audio file
        (`url`, `file_id`) and, when the app has transcription on, a `transcript`.
        When sending, give `url` or `file_id` of an audio file; channels without
        voice notes need `fallback` (`auto` sends it as an audio file).
      required: [type]
      properties:
        type:
          type: string
          enum: [voice]
          description: Always `voice`.
        url:
          type: string
          format: uri
          description: Where the audio is. Sending, an HTTPS URL Flow can fetch; inbound, a Flow file URL.
        file_id:
          $ref: "#/components/schemas/FileId"
        duration_seconds:
          type: number
          readOnly: true
          description: The voice note's length.
        transcript:
          type: string
          readOnly: true
          description: Inbound only, when transcription is on. What was said.
    ButtonsContent:
      type: object
      description: |
        Text with buttons, sent only, optionally under a `header`. Telegram shows an
        inline keyboard; WhatsApp shows up to 3 reply buttons, or a list for more;
        iMessage and SMS have no buttons (use `fallback`). A tap arrives as a
        `message.received` event with `button_reply` content carrying the button's
        `id`. URL buttons open a link and send nothing back.

        On WhatsApp, a message whose only button is one `UrlButton` (no reply buttons)
        goes as a call-to-action URL message: the text, the header if given, and one
        button that opens the link. A list (more than 3 reply buttons) takes only a
        `text` header; a media header there is refused with `invalid_request`. Footers
        are not supported.

        With a media `header`, Telegram sends one message: the photo, video or
        document with `text` as its caption and the inline keyboard under it, so
        `text` must then fit Telegram's caption limit of 1024 UTF-16 code units. With
        `fallback: auto` on iMessage and SMS, a media header is sent as its own media
        message before the numbered text (as `media` content would be), and a text
        header becomes the first line of the text.
      required: [type, text, buttons]
      properties:
        type:
          type: string
          enum: [buttons]
          description: Always `buttons`.
        header:
          $ref: "#/components/schemas/ContentHeader"
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            The text above the buttons: at most 4096 characters on Telegram (the same
            as a text message, in UTF-16 code units), or 1024 when the message has a
            media `header` (Telegram's caption limit), and 1024 on WhatsApp (its limit
            for messages with buttons). On iMessage, `fallback: auto` sends the text and
            the numbered choices as one text message, which must fit the channel's
            `max_text_length`. Longer text is refused with `invalid_request`.
        buttons:
          type: array
          minItems: 1
          maxItems: 10
          description: 1 to 10 buttons, in order.
          items:
            $ref: "#/components/schemas/Button"
    ContentHeader:
      type: object
      description: |
        What is shown above a message's text: an image, a video, a document or a
        short title. A media header takes exactly one of `url` (an HTTPS URL Flow
        fetches) or `file_id` (from `POST /v1/files`), and is fetched, checked and
        converted for the channel like `media` content (so WebP and other formats
        work); a `text` header takes `text`. Anything else, or a value over a limit,
        is refused with `invalid_request` naming the field in `param`.

        WhatsApp shows the header at the top of the same message bubble. Telegram
        sends one message: the media with the text as its caption and the buttons
        under it; a `text` header becomes the message's first line, in bold.
      required: [type]
      properties:
        type:
          type: string
          enum: [image, video, document, text]
          description: What the header holds.
        url:
          type: string
          format: uri
          description: Media headers only. An HTTPS URL of the media, which Flow fetches.
        file_id:
          $ref: "#/components/schemas/FileId"
        text:
          type: string
          minLength: 1
          maxLength: 60
          description: "`text` headers only. The title, 1 to 60 characters (WhatsApp's header limit)."
        filename:
          type: string
          maxLength: 255
          description: "`document` headers only. The file's name, shown with the document."
      examples:
        - {type: image, url: "https://example.com/menu.webp"}
        - {type: text, text: "Your order"}
    Button:
      description: A reply button (`id` and `label`) or a link button (`url` and `label`).
      oneOf:
        - $ref: "#/components/schemas/ReplyButton"
        - $ref: "#/components/schemas/UrlButton"
    ReplyButton:
      type: object
      description: A button that sends its `id` back as a `button_reply` when tapped.
      required: [id, label]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Your ID for the button, returned in `button_reply`.
        label:
          type: string
          minLength: 1
          maxLength: 20
          description: The button's text. WhatsApp shows at most 20 characters.
    UrlButton:
      type: object
      description: A button that opens a link.
      required: [url, label]
      properties:
        url:
          type: string
          format: uri
          description: The HTTPS link to open.
        label:
          type: string
          minLength: 1
          maxLength: 20
          description: The button's text.
    ButtonReplyContent:
      type: object
      description: Inbound only. The contact tapped a reply button (or, where buttons fell back to numbered text, answered with its number).
      required: [type, button_id, label]
      properties:
        type:
          type: string
          enum: [button_reply]
          description: Always `button_reply`.
        button_id:
          type: string
          description: The `id` of the tapped button.
        label:
          type: string
          description: The tapped button's label.
        message_id:
          $ref: "#/components/schemas/MessageId"
    CarouselContent:
      type: object
      description: |
        A row of 2 to 10 cards the contact scrolls sideways, under one text, sent
        only. Each card has an image or video, optional text, and its own buttons. A
        tap on a reply button arrives as `button_reply` content carrying the button's
        `id`, as for `buttons`; URL buttons open a link and send nothing back.

        Rules, each refused with `invalid_request` when broken: every card has the
        same number and kind of buttons; a card has either exactly one URL button or
        1 to 2 reply buttons; reply button `id`s are unique across the carousel.

        WhatsApp shows one interactive carousel message, inside the 24-hour window
        like any message that is not a template (a carousel template is sent as
        `template` content). Telegram, iMessage and SMS have no carousels: with
        `fallback: auto` Flow sends `text`, then each card as its own message (on
        Telegram the photo or video with the card's text as its caption and its
        buttons; elsewhere the channel's fallback for media and buttons, reply
        buttons numbered across the whole carousel), in order, each one after the
        channel acknowledged the one before. `delivered_as` reports it, and
        `channel_message_id` is the first of those messages.
      required: [type, text, cards]
      properties:
        type:
          type: string
          enum: [carousel]
          description: Always `carousel`.
        text:
          type: string
          minLength: 1
          maxLength: 1024
          description: The message text shown above the cards, 1 to 1024 characters. Longer text is refused with `invalid_request`.
        cards:
          type: array
          minItems: 2
          maxItems: 10
          description: 2 to 10 cards, in the order shown (left to right).
          items:
            $ref: "#/components/schemas/CarouselCard"
      examples:
        - type: carousel
          text: "Three picks for you"
          cards:
            - header: {type: image, url: "https://example.com/a.jpg"}
              text: "Linen shirt, 1,499"
              buttons: [{id: "buy_a", label: "Buy"}]
            - header: {type: image, url: "https://example.com/b.jpg"}
              text: "Denim jacket, 2,999"
              buttons: [{id: "buy_b", label: "Buy"}]
    CarouselCard:
      type: object
      description: One card of a carousel.
      required: [header, buttons]
      properties:
        header:
          $ref: "#/components/schemas/ContentHeader"
          description: The card's image or video, a `ContentHeader` of type `image` or `video` only (by `url` or `file_id`); any other type is refused with `invalid_request` at `content.cards[i].header.type`.
        text:
          type: string
          minLength: 1
          maxLength: 160
          description: The card's text, at most 160 characters and 2 line breaks.
        buttons:
          type: array
          minItems: 1
          maxItems: 2
          description: Exactly one URL button, or 1 to 2 reply buttons; the same number and kind on every card. Labels are at most 20 characters.
          items:
            $ref: "#/components/schemas/Button"
    ReactionContent:
      type: object
      description: |
        A reaction to a message, both ways. Set `emoji` to `null` to remove your
        reaction. iMessage has a fixed set of tapbacks; with `fallback: "auto"` the
        closest tapback is used, or the reaction is skipped and reported in
        `delivered_as`. Inbound reactions also arrive as `reaction.added` and
        `reaction.removed` events.
      required: [type, message_id, emoji]
      properties:
        type:
          type: string
          enum: [reaction]
          description: Always `reaction`.
        message_id:
          $ref: "#/components/schemas/MessageId"
        emoji:
          type: [string, "null"]
          maxLength: 16
          description: One emoji, or `null` to remove the reaction.
    TemplateContent:
      type: object
      description: |
        A WhatsApp message template, sent only. Required to start a WhatsApp
        conversation or to write after the 24-hour window closed. The template must be
        `approved`.

        A media card carousel template (marketing category) is sent the same way, with
        one entry per card in `params.cards`. Inside the 24-hour window a carousel needs
        no template: send `carousel` content.
      required: [type, template_id, language]
      properties:
        type:
          type: string
          enum: [template]
          description: Always `template`.
        template_id:
          $ref: "#/components/schemas/TemplateId"
        language:
          type: string
          description: The template language to use, as Meta names it (`en`, `en_US`, `hi`).
        params:
          $ref: "#/components/schemas/TemplateParams"
    TemplateParams:
      type: object
      description: Values for the template's placeholders.
      properties:
        header:
          $ref: "#/components/schemas/TemplateHeaderParam"
        body:
          type: array
          description: Values for the body's `{{1}}`, `{{2}}`, ... in order.
          items:
            type: string
        buttons:
          type: array
          description: Values for buttons that take one (URL suffixes, quick-reply payloads).
          items:
            $ref: "#/components/schemas/TemplateButtonParam"
        cards:
          type: array
          maxItems: 10
          description: Carousel templates only. Values for each card's header, body placeholders and buttons.
          items:
            $ref: "#/components/schemas/TemplateCardParams"
    TemplateCardParams:
      type: object
      description: The values for one card of a carousel template.
      required: [card_index]
      properties:
        card_index:
          type: integer
          minimum: 0
          maximum: 9
          description: The card's position in the template, from 0.
        header:
          $ref: "#/components/schemas/TemplateHeaderParam"
          description: The card's image or video (`kind` `image` or `video`, by `url` or `file_id`).
        body:
          type: array
          description: Values for the card body's `{{1}}`, `{{2}}`, ... in order.
          items:
            type: string
        buttons:
          type: array
          description: Values for the card's buttons that take one (URL suffixes, quick-reply payloads).
          items:
            $ref: "#/components/schemas/TemplateButtonParam"
      examples:
        - card_index: 0
          header: {kind: image, url: "https://example.com/a.jpg"}
          body: ["Linen shirt"]
          buttons: [{index: 0, value: "buy_a"}]
    TemplateHeaderParam:
      type: object
      description: The value of a template's header, when it has a placeholder or media.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [text, image, video, document]
          description: What the header holds.
        text:
          type: string
          description: For `text` headers, the placeholder's value.
        url:
          type: string
          format: uri
          description: For media headers, an HTTPS URL of the media.
        file_id:
          $ref: "#/components/schemas/FileId"
    TemplateButtonParam:
      type: object
      description: The value for one of the template's buttons.
      required: [index, value]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 9
          description: The button's position in the template, from 0.
        value:
          type: string
          description: The URL suffix or the quick-reply payload.
    LocationContent:
      type: object
      description: A place, both ways. Inbound, a location the contact shared. Channels without locations need `fallback` (`auto` sends a maps link).
      required: [type, lat, lng]
      properties:
        type:
          type: string
          enum: [location]
          description: Always `location`.
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude in degrees.
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude in degrees.
        name:
          type: string
          description: The place's name.
        address:
          type: string
          description: The place's address.
    ContactCardContent:
      type: object
      description: A contact card, both ways. Channels without cards need `fallback` (`auto` sends it as text).
      required: [type, name]
      properties:
        type:
          type: string
          enum: [contact_card]
          description: Always `contact_card`.
        name:
          type: string
          description: The person's or business's name.
        phones:
          type: array
          description: Phone numbers, E.164 where known.
          items:
            type: string
        emails:
          type: array
          description: Email addresses.
          items:
            type: string
            format: email
    EffectContent:
      type: object
      description: Text sent with an iMessage effect, sent only. Other channels need `fallback` (`auto` sends the plain text). Which effects are available may vary.
      required: [type, text, effect]
      properties:
        type:
          type: string
          enum: [effect]
          description: Always `effect`.
        text:
          type: string
          minLength: 1
          maxLength: 9999
          description: The text, at most the channel's `max_text_length` characters (4096 on Telegram and WhatsApp, 9999 on iMessage, 1530 on SMS, where it must also fit in 10 segments, 670 characters when it holds an emoji or other character outside GSM-7; see `GET /v1/capabilities`). Telegram counts UTF-16 code units, so an emoji such as 😀 counts as 2. Longer text is refused with `invalid_request`.
        effect:
          type: string
          description: The effect.
          enum: [slam, loud, gentle, invisible_ink, echo, spotlight, balloons, confetti, love, lasers, fireworks, celebration]
    TypingContent:
      type: object
      description: The typing indicator, sent only (the stream's and webhook replies' way to type; over HTTP use `POST /v1/conversations/{conversation_id}/typing`). Skipped where the channel has none.
      required: [type, state]
      properties:
        type:
          type: string
          enum: [typing]
          description: Always `typing`.
        state:
          type: string
          enum: ["on", "off"]
          description: "`on` shows the indicator, `off` clears it."
    ReadContent:
      type: object
      description: A read receipt, sent only (over HTTP use `POST /v1/conversations/{conversation_id}/read`). Skipped on Telegram, where bots cannot send them. On iMessage the whole conversation is marked read.
      required: [type]
      properties:
        type:
          type: string
          enum: [read]
          description: Always `read`.
        up_to:
          $ref: "#/components/schemas/MessageId"
          description: The latest inbound message to mark read (default the latest inbound message). No effect on iMessage.
    EditContent:
      type: object
      description: Replaces the text of one of your sent messages, sent only (over HTTP use `PATCH /v1/messages/{message_id}`). Telegram and iMessage; WhatsApp refuses it with `unsupported_content`.
      required: [type, message_id, content]
      properties:
        type:
          type: string
          enum: [edit]
          description: Always `edit`.
        message_id:
          $ref: "#/components/schemas/MessageId"
        content:
          $ref: "#/components/schemas/TextContent"
    UnsendContent:
      type: object
      description: Removes one of your sent messages from the contact's chat, sent only (over HTTP use `DELETE /v1/messages/{message_id}`). Telegram and iMessage; WhatsApp refuses it with `unsupported_content`.
      required: [type, message_id]
      properties:
        type:
          type: string
          enum: [unsend]
          description: Always `unsend`.
        message_id:
          $ref: "#/components/schemas/MessageId"
    FileBlockedContent:
      type: object
      description: |
        Inbound only. The contact sent a file that Flow did not keep: it failed the
        malware scan, its real type is one Flow does not pass on (programs, web
        pages), it could not be scanned, or it is larger than the channel lets Flow
        download. The file is not stored and has no `url`; what is known about it is
        here. Images, audio and video are not scanned; documents (PDF, Office,
        archives) are, and one Flow could not scan arrives with `reason`
        `scan_failed`.
      required: [type, reason]
      properties:
        type:
          type: string
          enum: [file_blocked]
          description: Always `file_blocked`.
        reason:
          type: string
          enum: [malware, type_not_allowed, scan_failed, too_large]
          description: "Why the file was not kept: `malware` (the scan found something), `type_not_allowed`, `scan_failed` (the scanner could not check it; ask the contact to send it again), or `too_large`."
        kind:
          type: string
          enum: [image, video, document, audio]
          description: What kind of media the channel said it was.
        filename:
          type: string
          description: The file's name, if it had one.
        mime_type:
          type: string
          description: The real type, read from the file's first bytes, when Flow read them.
        size_bytes:
          type: integer
          description: The file's size, when known.
        caption:
          type: string
          description: Text the contact sent with the file.

    # ---------------------------------------------------------------- events
    EventType:
      type: string
      description: |
        - `message.received`: the contact sent something with content (a button tap arrives as `button_reply` content).
        - `message.sent`, `message.delivered`, `message.read`, `message.failed`: the status of your outbound messages. `message.failed` carries the error in `data.message.error`.
        - `reaction.added`, `reaction.removed`: the contact reacted to a message.
        - `typing.started`, `typing.stopped`: the contact is typing, where the channel reports it.
        - `conversation.started`: the first inbound message from a new contact, a sandbox join (Flow itself answers the join; the join message is not a `message.received`), or your first send to a new contact (`via` `outbound`).
        - `conversation.window_closing`: WhatsApp only, opt-in. The 24-hour window closes in 1 hour.
        - `sender.status_changed`: a sender was throttled, flagged, banned or restored, or its WhatsApp quality rating changed.
        - `template.status_changed`: Meta approved, rejected or paused a template.
        - `contact.deleted`: a contact was deleted with `DELETE /v1/contacts/{contact_id}`. Carries only the contact's ID; delete what you keep about them too.
      enum:
        - message.received
        - message.sent
        - message.delivered
        - message.read
        - message.failed
        - reaction.added
        - reaction.removed
        - typing.started
        - typing.stopped
        - conversation.started
        - conversation.window_closing
        - sender.status_changed
        - template.status_changed
        - contact.deleted
    Timing:
      type: object
      description: |
        When the event moved through Flow, to measure Flow's overhead
        (`delivered_at` minus `received_at`).
      required: [received_at, stored_at]
      properties:
        received_at:
          type: string
          format: date-time
          description: When Flow received it from the channel, or when it happened inside Flow.
        stored_at:
          type: string
          format: date-time
          description: When it was committed to the log.
        delivered_at:
          type: string
          format: date-time
          description: |
            When the event went out to a webhook endpoint. Its value depends on
            where you read it. In a webhook delivery's body, it is when that delivery
            attempt started (each attempt to each endpoint gets its own), unless an
            endpoint had already accepted the event, in which case it is that
            acceptance time. In the event log (`GET /v1/events`,
            `GET /v1/events/{event_id}`, the stream), it is when the first endpoint
            accepted the event, and it is absent until one has (always, for an app
            with no webhook endpoints).
    EventBase:
      type: object
      description: The fields every event has.
      required: [id, created_at, app, livemode, timing]
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        created_at:
          type: string
          format: date-time
          description: When the event was created. Events are ordered in the log by commit, not by this time.
        app:
          $ref: "#/components/schemas/AppId"
        livemode:
          type: boolean
          description: Whether the event belongs to live mode.
        conversation:
          $ref: "#/components/schemas/ConversationRef"
        timing:
          $ref: "#/components/schemas/Timing"
    Event:
      description: |
        One entry in your app's log. `type` says what happened and selects the shape
        of `data`. `conversation` is set for every event that happened in a
        conversation (all but `sender.status_changed`, `template.status_changed` and
        `contact.deleted`).
      oneOf:
        - $ref: "#/components/schemas/MessageReceivedEvent"
        - $ref: "#/components/schemas/MessageSentEvent"
        - $ref: "#/components/schemas/MessageDeliveredEvent"
        - $ref: "#/components/schemas/MessageReadEvent"
        - $ref: "#/components/schemas/MessageFailedEvent"
        - $ref: "#/components/schemas/ReactionAddedEvent"
        - $ref: "#/components/schemas/ReactionRemovedEvent"
        - $ref: "#/components/schemas/TypingStartedEvent"
        - $ref: "#/components/schemas/TypingStoppedEvent"
        - $ref: "#/components/schemas/ConversationStartedEvent"
        - $ref: "#/components/schemas/ConversationWindowClosingEvent"
        - $ref: "#/components/schemas/SenderStatusChangedEvent"
        - $ref: "#/components/schemas/TemplateStatusChangedEvent"
        - $ref: "#/components/schemas/ContactDeletedEvent"
      discriminator:
        propertyName: type
        mapping:
          message.received: "#/components/schemas/MessageReceivedEvent"
          message.sent: "#/components/schemas/MessageSentEvent"
          message.delivered: "#/components/schemas/MessageDeliveredEvent"
          message.read: "#/components/schemas/MessageReadEvent"
          message.failed: "#/components/schemas/MessageFailedEvent"
          reaction.added: "#/components/schemas/ReactionAddedEvent"
          reaction.removed: "#/components/schemas/ReactionRemovedEvent"
          typing.started: "#/components/schemas/TypingStartedEvent"
          typing.stopped: "#/components/schemas/TypingStoppedEvent"
          conversation.started: "#/components/schemas/ConversationStartedEvent"
          conversation.window_closing: "#/components/schemas/ConversationWindowClosingEvent"
          sender.status_changed: "#/components/schemas/SenderStatusChangedEvent"
          template.status_changed: "#/components/schemas/TemplateStatusChangedEvent"
          contact.deleted: "#/components/schemas/ContactDeletedEvent"
    MessageEventData:
      type: object
      description: The message the event is about.
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"
    MessageReceivedEvent:
      description: The contact sent a message. `data.message.content` is what they sent.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [message.received]
              description: Always `message.received`.
            data:
              $ref: "#/components/schemas/MessageEventData"
    MessageSentEvent:
      description: The channel accepted one of your messages.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [message.sent]
              description: Always `message.sent`.
            data:
              $ref: "#/components/schemas/MessageEventData"
    MessageDeliveredEvent:
      description: One of your messages reached the contact's device.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [message.delivered]
              description: Always `message.delivered`.
            data:
              $ref: "#/components/schemas/MessageEventData"
    MessageReadEvent:
      description: The contact read one of your messages.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [message.read]
              description: Always `message.read`.
            data:
              $ref: "#/components/schemas/MessageEventData"
    MessageFailedEvent:
      description: One of your messages could not be sent. `data.message.error` says why, mapped to an `ErrorType`.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [message.failed]
              description: Always `message.failed`.
            data:
              $ref: "#/components/schemas/MessageEventData"
    ReactionEventData:
      type: object
      description: A reaction the contact added or removed.
      required: [message_id, emoji]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        emoji:
          type: string
          description: The emoji (iMessage tapbacks are mapped to their closest emoji).
    ReactionAddedEvent:
      description: The contact reacted to a message.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [reaction.added]
              description: Always `reaction.added`.
            data:
              $ref: "#/components/schemas/ReactionEventData"
    ReactionRemovedEvent:
      description: The contact removed a reaction.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [reaction.removed]
              description: Always `reaction.removed`.
            data:
              $ref: "#/components/schemas/ReactionEventData"
    TypingEventData:
      type: object
      description: Who is typing.
      required: [contact]
      properties:
        contact:
          $ref: "#/components/schemas/ContactId"
    TypingStartedEvent:
      description: The contact started typing, where the channel reports it.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [typing.started]
              description: Always `typing.started`.
            data:
              $ref: "#/components/schemas/TypingEventData"
    TypingStoppedEvent:
      description: The contact stopped typing, where the channel reports it.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [typing.stopped]
              description: Always `typing.stopped`.
            data:
              $ref: "#/components/schemas/TypingEventData"
    ConversationStartedData:
      type: object
      description: The new conversation and how it began.
      required: [conversation, via]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        via:
          type: string
          description: "`inbound` (the contact wrote first), `sandbox_join` (they sent your app's join code) or `outbound` (you started it)."
          enum: [inbound, sandbox_join, outbound]
    ConversationStartedEvent:
      description: |
        A new conversation began. Sent before the first `message.received` of a new
        contact, or, when you started the conversation (`data.via` `outbound`), with
        your first send to the contact. A sandbox join (`data.via` `sandbox_join`) also starts one: the join
        message itself is not delivered as `message.received`, and the sandbox bot's
        confirmation ("You're connected to <your app>") is sent by Flow itself, not
        by your app, and counts against no allowance. Joining again in a
        conversation that already exists sends no new `conversation.started`.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [conversation.started]
              description: Always `conversation.started`.
            data:
              $ref: "#/components/schemas/ConversationStartedData"
    WindowClosingData:
      type: object
      description: When the window closes.
      required: [window_open_until]
      properties:
        window_open_until:
          type: string
          format: date-time
          description: After this time only templates can be sent.
    ConversationWindowClosingEvent:
      description: WhatsApp only, opt-in per endpoint. The conversation's 24-hour window closes in 1 hour.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [conversation.window_closing]
              description: Always `conversation.window_closing`.
            data:
              $ref: "#/components/schemas/WindowClosingData"
    SenderStatusChangedData:
      type: object
      description: The sender as it is now, and what changed.
      required: [sender, previous_status, reason]
      properties:
        sender:
          $ref: "#/components/schemas/Sender"
        previous_status:
          $ref: "#/components/schemas/SenderStatus"
        reason:
          type: string
          description: Why, in one sentence (for example "Many new conversations got no reply; starts are slowed for 24 hours").
    SenderStatusChangedEvent:
      description: A sender's status or WhatsApp quality rating changed.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [sender.status_changed]
              description: Always `sender.status_changed`.
            data:
              $ref: "#/components/schemas/SenderStatusChangedData"
    TemplateStatusChangedData:
      type: object
      description: The template as it is now, and what changed.
      required: [template, previous_status]
      properties:
        template:
          $ref: "#/components/schemas/Template"
        previous_status:
          $ref: "#/components/schemas/TemplateStatus"
        reason:
          type: string
          description: Meta's reason, when it gives one.
    TemplateStatusChangedEvent:
      description: Meta approved, rejected or paused a template.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [template.status_changed]
              description: Always `template.status_changed`.
            data:
              $ref: "#/components/schemas/TemplateStatusChangedData"
    ContactDeletedData:
      type: object
      description: The contact that was deleted. Only the ID is kept.
      required: [contact]
      properties:
        contact:
          $ref: "#/components/schemas/ContactId"
    ContactDeletedEvent:
      description: |
        A contact was deleted with `DELETE /v1/contacts/{contact_id}`: their address,
        messages, files and events are erased at Flow. Delete what you keep about
        them too. Sent once, for the first delete; it has no `conversation`.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [contact.deleted]
              description: Always `contact.deleted`.
            data:
              $ref: "#/components/schemas/ContactDeletedData"
    EventList:
      type: object
      description: A page of events, oldest first.
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        has_more:
          type: boolean
          description: Whether more committed events follow this page.

    # ---------------------------------------------------------------- stream
    StreamFrame:
      description: |
        One JSON frame on the `/v1/stream` WebSocket. The server sends `event`, `ack`,
        `error` and `reconnect`; the client sends `send` and `start`.
      oneOf:
        - $ref: "#/components/schemas/StreamEventFrame"
        - $ref: "#/components/schemas/StreamAckFrame"
        - $ref: "#/components/schemas/StreamErrorFrame"
        - $ref: "#/components/schemas/StreamReconnectFrame"
        - $ref: "#/components/schemas/StreamSendFrame"
        - $ref: "#/components/schemas/StreamStartFrame"
      discriminator:
        propertyName: type
        mapping:
          event: "#/components/schemas/StreamEventFrame"
          ack: "#/components/schemas/StreamAckFrame"
          error: "#/components/schemas/StreamErrorFrame"
          reconnect: "#/components/schemas/StreamReconnectFrame"
          send: "#/components/schemas/StreamSendFrame"
          start: "#/components/schemas/StreamStartFrame"
    StreamEventFrame:
      type: object
      description: Server to client. One event from the log.
      required: [type, event]
      properties:
        type:
          type: string
          enum: [event]
          description: Always `event`.
        event:
          $ref: "#/components/schemas/Event"
    StreamAckFrame:
      type: object
      description: Server to client. A `send` or `start` frame was accepted.
      required: [type, ref, message]
      properties:
        type:
          type: string
          enum: [ack]
          description: Always `ack`.
        ref:
          type: string
          description: The `ref` of the frame being answered.
        message:
          $ref: "#/components/schemas/Message"
    StreamErrorFrame:
      type: object
      description: Server to client. A `send` or `start` frame was refused (with its `ref`), or the stream itself was refused or failed (without `ref`; the server then closes the socket with a 4000-range close code, `4401` for `authentication`, see `GET /v1/stream`).
      required: [type, error]
      properties:
        type:
          type: string
          enum: [error]
          description: Always `error`.
        ref:
          type: string
          description: The `ref` of the frame being answered, if any.
        error:
          $ref: "#/components/schemas/ErrorBody"
    StreamReconnectFrame:
      type: object
      description: Server to client. The server is restarting; reconnect with `after` set to the last event you received. The socket closes after this frame.
      required: [type]
      properties:
        type:
          type: string
          enum: [reconnect]
          description: Always `reconnect`.
        after:
          $ref: "#/components/schemas/EventId"
    StreamSendFrame:
      type: object
      description: Client to server. Same as `POST /v1/conversations/{conversation_id}/messages`; `ref` is also the idempotency key.
      required: [type, ref, conversation, message]
      properties:
        type:
          type: string
          enum: [send]
          description: Always `send`.
        ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Your ID for this frame, echoed in the answer and used as the idempotency key.
        conversation:
          $ref: "#/components/schemas/ConversationId"
        message:
          $ref: "#/components/schemas/SendMessageRequest"
    StreamStartFrame:
      type: object
      description: Client to server. Same as `POST /v1/messages`; `ref` is also the idempotency key.
      required: [type, ref, message]
      properties:
        type:
          type: string
          enum: [start]
          description: Always `start`.
        ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Your ID for this frame, echoed in the answer and used as the idempotency key.
        message:
          $ref: "#/components/schemas/StartConversationRequest"

    # ---------------------------------------------------------------- capabilities
    Capabilities:
      type: object
      description: What a conversation's channel supports now.
      required: [conversation, channel, window, content]
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationId"
        channel:
          $ref: "#/components/schemas/Channel"
        window:
          $ref: "#/components/schemas/WindowState"
        content:
          type: array
          description: One entry per content type that can be sent.
          items:
            $ref: "#/components/schemas/ContentSupport"
        limits:
          $ref: "#/components/schemas/ChannelLimits"
    WindowState:
      type: object
      description: Whether free-form messages can be sent now.
      required: [open]
      properties:
        open:
          type: boolean
          description: "`true` when any content can be sent; `false` when only a `template` can (WhatsApp after 24 hours)."
        open_until:
          type: string
          format: date-time
          description: WhatsApp only. When the window closes, if it is open.
    ContentSupport:
      type: object
      description: How the channel handles one content type.
      required: [type, support]
      properties:
        type:
          $ref: "#/components/schemas/ContentType"
        support:
          type: string
          description: "`native` (shown as sent), `fallback` (needs `fallback`; `auto` sends `fallback_type`) or `unsupported` (cannot be sent)."
          enum: [native, fallback, unsupported]
        fallback_type:
          type: string
          description: 'With `support` `fallback`, what `fallback: "auto"` sends instead, or `none` when it is skipped.'
          enum: [text, media, none]
        note:
          type: string
          description: A limit worth knowing (for example "up to 3 buttons, else a list").
    ChannelLimits:
      type: object
      description: Size limits on this channel.
      properties:
        max_text_length:
          type: integer
          description: The longest text one message may carry, in characters (4096 on Telegram and WhatsApp, 9999 on iMessage, 1530 on SMS). Telegram counts UTF-16 code units, so an emoji such as 😀 counts as 2; the other channels count Unicode characters. A media caption takes at most 1024. Longer text is refused with `invalid_request`.
        max_sms_segments:
          type: integer
          description: |
            SMS only. The most segments one text may take (10); see `SmsSegments`. A text of more segments is refused with `invalid_request`: 1530 GSM-7 characters (fewer when it uses GSM-7's two-unit characters such as `{` or `€`), or 670 when it holds an emoji or other character outside GSM-7.
        max_caption_length:
          type: integer
          description: The longest caption a media message may carry, and the longest `text` of a buttons message with a media `header` (1024; Telegram counts UTF-16 code units).
        max_buttons:
          type: integer
          description: The most buttons one message may carry natively.
        max_file_bytes:
          type: integer
          description: The largest file one message may carry.

    # ---------------------------------------------------------------- files
    FileUpload:
      type: object
      description: A file to upload, as multipart form data.
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The file's bytes. Its real type is read from its first bytes.
        filename:
          type: string
          maxLength: 255
          description: The name to show for the file; defaults to the uploaded part's file name.
        channel:
          $ref: "#/components/schemas/Channel"
    File:
      type: object
      description: A stored file. Send it as `media` or `voice` content by `file_id`.
      required: [id, mime_type, size_bytes, url, livemode, created_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/FileId"
        mime_type:
          type: string
          description: The real type, checked from the first bytes.
        size_bytes:
          type: integer
          description: The file's size.
        filename:
          type: string
          description: The file's name, if it has one.
        url:
          type: string
          format: uri
          description: Its Flow URL (`https://api.flow.engineer/v1/files/{file_id}`), which redirects to the bytes for an authenticated request.
        livemode:
          type: boolean
          description: Whether the file belongs to live mode.
        created_at:
          type: string
          format: date-time
          description: When the file was stored.
        expires_at:
          type: string
          format: date-time
          description: When the file will be deleted under your plan's retention.

    # ---------------------------------------------------------------- templates
    TemplateStatus:
      type: string
      description: A template's approval status at Meta.
      enum: [pending, approved, rejected, paused, disabled]
    TemplateCategory:
      type: string
      description: Meta's category for the template, which sets its price.
      enum: [marketing, utility, authentication]
    Template:
      type: object
      description: A WhatsApp message template, mirrored from Meta with its approval status.
      required: [id, sender, name, language, category, status, components, created_at]
      properties:
        id:
          $ref: "#/components/schemas/TemplateId"
        sender:
          $ref: "#/components/schemas/SenderId"
        name:
          type: string
          description: The template's name at Meta.
        language:
          type: string
          description: The template's language, as Meta names it.
        category:
          $ref: "#/components/schemas/TemplateCategory"
        status:
          $ref: "#/components/schemas/TemplateStatus"
        components:
          type: array
          description: The template's parts, as submitted.
          items:
            $ref: "#/components/schemas/TemplateComponent"
        rejection_reason:
          type: string
          description: Meta's reason, when the template was rejected.
        created_at:
          type: string
          format: date-time
          description: When the template was submitted.
    TemplateComponent:
      type: object
      description: One part of a template. Placeholders are written `{{1}}`, `{{2}}`, ...
      required: [type]
      properties:
        type:
          type: string
          enum: [header, body, footer, buttons]
          description: Which part this is.
        format:
          type: string
          enum: [text, image, video, document]
          description: For headers, what the header holds.
        text:
          type: string
          description: The part's text, with placeholders.
        buttons:
          type: array
          description: For `buttons`, the buttons in order.
          items:
            $ref: "#/components/schemas/TemplateButton"
    TemplateButton:
      type: object
      description: One button of a template.
      required: [type, text]
      properties:
        type:
          type: string
          enum: [quick_reply, url, phone_number]
          description: What the button does.
        text:
          type: string
          description: The button's label.
        url:
          type: string
          description: For `url` buttons, the link, optionally ending in a `{{1}}` placeholder.
        phone:
          type: string
          description: For `phone_number` buttons, the E.164 number.
    TemplateCreateRequest:
      type: object
      description: A template to submit to Meta.
      required: [sender, name, language, category, components]
      properties:
        sender:
          $ref: "#/components/schemas/SenderId"
        name:
          type: string
          pattern: "^[a-z0-9_]{1,512}$"
          description: Lowercase letters, digits and underscores.
        language:
          type: string
          description: The template's language, as Meta names it (`en`, `en_US`, `hi`).
        category:
          $ref: "#/components/schemas/TemplateCategory"
        components:
          type: array
          minItems: 1
          description: The template's parts. A body is required.
          items:
            $ref: "#/components/schemas/TemplateComponent"
    TemplateList:
      type: object
      description: A page of templates.
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        has_more:
          type: boolean
          description: Whether more items lie beyond this page in the direction you paged.

    # ---------------------------------------------------------------- testing
    TestConversationRequest:
      type: object
      description: A simulated conversation to create (test keys only).
      required: [channel]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
          description: The channel to simulate. `telegram`, `whatsapp`, `imessage` or `sms`.
        contact:
          $ref: "#/components/schemas/TestContactAddress"
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The simulated contact's display name, as a channel would report it.
    TestContactAddress:
      type: object
      description: |
        The simulated contact's address on the channel. Give one field that fits the
        channel: `phone` on SMS, iMessage and WhatsApp, `handle` on iMessage,
        `telegram_user_id` on Telegram. Omit `contact` to get a new contact with a made-up address.
      minProperties: 1
      maxProperties: 1
      properties:
        phone:
          type: string
          description: SMS, iMessage or WhatsApp. E.164 phone number; on SMS a US number (`+1` and ten digits).
          pattern: "^\\+[1-9][0-9]{6,14}$"
        handle:
          type: string
          minLength: 3
          maxLength: 254
          description: iMessage. A phone number or an email address.
        telegram_user_id:
          type: string
          description: Telegram. A numeric user ID.
          pattern: "^[1-9][0-9]{0,15}$"
    SimulatedInboundRequest:
      type: object
      description: One turn from a simulated contact (test keys only).
      required: [content]
      properties:
        content:
          $ref: "#/components/schemas/SimulatedInboundContent"
          description: |
            What the contact sends: `text`, `media`, `voice`, `location`,
            `contact_card` or `button_reply` (a tap on a reply button, named by the
            buttons message and the button's `id`). Media and voice take a `file_id`
            from `POST /v1/files`. Other types answer `400 invalid_request`.
        reply_to:
          $ref: "#/components/schemas/MessageId"
          description: A message of this conversation the contact replies to inline, on channels with inline replies (Telegram, iMessage; on SMS it answers `400 invalid_request`). The received message shows it in `reply_to`.
    SimulatedInboundContent:
      type: object
      description: |
        What a simulated contact sends in one turn: `text`, `media`, `voice`,
        `location`, `contact_card`, or a tap on a reply button (`button_reply`).
        Other content types answer `400 invalid_request`.
      oneOf:
        - $ref: "#/components/schemas/TextContent"
        - $ref: "#/components/schemas/MediaContent"
        - $ref: "#/components/schemas/VoiceContent"
        - $ref: "#/components/schemas/LocationContent"
        - $ref: "#/components/schemas/ContactCardContent"
        - $ref: "#/components/schemas/SimulatedButtonTap"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextContent"
          media: "#/components/schemas/MediaContent"
          voice: "#/components/schemas/VoiceContent"
          location: "#/components/schemas/LocationContent"
          contact_card: "#/components/schemas/ContactCardContent"
          button_reply: "#/components/schemas/SimulatedButtonTap"
    SimulatedButtonTap:
      type: object
      description: |
        The simulated contact taps a reply button of a buttons message your app sent
        in this conversation. Name the message and the button's `id`; Flow fills in
        the label, and the received message is a `button_reply` with the tapped
        button's `label`. On a channel that shows no buttons the contact answers the
        numbered text instead (send the number as `text`).
      required: [type, message_id, button_id]
      properties:
        type:
          type: string
          enum: [button_reply]
          description: Always `button_reply`.
        message_id:
          $ref: "#/components/schemas/MessageId"
          description: The buttons message your app sent, which must have reached the contact (its `message.sent`).
        button_id:
          type: string
          minLength: 1
          description: The `id` of the tapped reply button.
        label:
          type: string
          description: "Ignored: Flow uses the tapped button's label."
      examples:
        - {type: button_reply, message_id: msg_01JB8ZD4M6P8R0T2V4X6Z8B0C2, button_id: "yes"}
    SimulatedInbound:
      type: object
      description: A simulated turn Flow accepted. Its `message.received` event follows.
      required: [message, conversation, channel_message_id, status]
      properties:
        message:
          $ref: "#/components/schemas/MessageId"
          description: The ID the received message will have, in its `message.received` event and in the transcript.
        conversation:
          $ref: "#/components/schemas/ConversationId"
        channel_message_id:
          type: string
          description: The simulated channel's ID for the message (the received message's `channel_message_id`).
        status:
          type: string
          description: Always `queued`; the message is stored and delivered right after.
          enum: [queued]
    TestTranscript:
      type: object
      description: A page of a simulated conversation, both directions, oldest first.
      required: [conversation, data, has_more]
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationId"
        data:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        has_more:
          type: boolean
          description: Whether more messages follow; page on with `after` set to the last message's ID.
    TranscriptEntry:
      description: |
        One message of a simulated conversation: the `Message`, plus `shown` for a
        sent message.
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            shown:
              $ref: "#/components/schemas/Content"
              description: |
                Sent messages only: what the simulated contact sees, after the send gate
                applied any fallback (the same as `content` when it was shown as sent).
                Absent for received messages, for messages not sent yet or failed, and
                when nothing was shown (`delivered_as.type` `none`, such as typing on
                SMS).
    # ---------------------------------------------------------------- webhook endpoints
    WebhookEndpoint:
      type: object
      description: A URL that receives your app's events of the types it subscribes to.
      required: [id, url, events, enabled, livemode, created_at]
      properties:
        id:
          $ref: "#/components/schemas/WebhookEndpointId"
        url:
          type: string
          format: uri
          description: The HTTPS URL events are posted to.
        events:
          type: array
          description: The event types delivered to this endpoint.
          items:
            $ref: "#/components/schemas/EventType"
        description:
          type: string
          description: Your note about the endpoint.
        enabled:
          type: boolean
          description: Whether events are delivered. Disabled endpoints keep their place; nothing is lost from the log.
        livemode:
          type: boolean
          description: Whether the endpoint receives live-mode or test-mode events.
        secret:
          type: string
          description: The signing secret (`whsec_...`). Only in the answers to create and to rotate the secret.
        previous_secret_expires_at:
          type: string
          format: date-time
          description: While a secret rotation overlaps, when the previous secret stops signing. Absent when only one secret is active.
        created_at:
          type: string
          format: date-time
          description: When the endpoint was created.
    WebhookEndpointCreateRequest:
      type: object
      description: A new webhook endpoint.
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: An HTTPS URL on a public address.
        events:
          type: array
          minItems: 1
          description: The event types to deliver.
          items:
            $ref: "#/components/schemas/EventType"
        description:
          type: string
          maxLength: 500
          description: Your note about the endpoint.
    WebhookEndpointUpdateRequest:
      type: object
      description: Changes to a webhook endpoint. Fields left out are kept.
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: An HTTPS URL on a public address.
        events:
          type: array
          minItems: 1
          description: The event types to deliver.
          items:
            $ref: "#/components/schemas/EventType"
        description:
          type: string
          maxLength: 500
          description: Your note about the endpoint.
        enabled:
          type: boolean
          description: Whether to deliver events.
    WebhookEndpointList:
      type: object
      description: A page of webhook endpoints.
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        has_more:
          type: boolean
          description: Whether more items lie beyond this page in the direction you paged.
    WebhookSecretRotateRequest:
      type: object
      description: Options for rotating a webhook endpoint's signing secret.
      properties:
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
          description: How long the previous secret keeps signing alongside the new one, in seconds (at most 7 days). `0` retires it at once.
    WebhookReply:
      type: object
      description: |
        The optional body of your answer to a `message.received` delivery. `reply` is
        one piece of content or a list of up to 10, sent in order into the event's
        conversation through the send gate. A non-empty string, as `reply` or as an
        item of the list, is text: `{"reply": "Hi"}` is short for
        `{"reply": {"type": "text", "text": "Hi"}}`. Leave `reply` out, set it to `null`, or
        answer `{}`, an empty body or any body that is not a JSON object (such as
        `OK`) to send nothing now; that is not an error.

        A JSON object whose `reply` (or `fallback`, alongside a `reply`) does not match
        this shape, or a body that starts with `{` but is not valid JSON, sends
        nothing at all (no piece of a list goes out) and is recorded on the delivery as an `invalid_request` error
        with the reason; the delivery counts as delivered and is not retried.
      properties:
        reply:
          description: One piece of content, or a list of 1 to 10 pieces sent in order. A non-empty string is text content. `null` sends nothing.
          oneOf:
            - $ref: "#/components/schemas/Content"
            - type: string
              minLength: 1
              description: "Text to send, as `{\"type\": \"text\", \"text\": \"...\"}`."
            - type: array
              minItems: 1
              maxItems: 10
              items:
                oneOf:
                  - $ref: "#/components/schemas/Content"
                  - type: string
                    minLength: 1
                    description: "Text to send, as `{\"type\": \"text\", \"text\": \"...\"}`."
            - type: "null"
        fallback:
          $ref: "#/components/schemas/Fallback"
          description: What to send when the channel cannot show a piece of `reply`, as on HTTP sends. It applies to every piece.
      examples:
        - reply:
            - {type: text, text: "Here are the sizes we have."}
            - type: buttons
              text: "Which size?"
              buttons:
                - {id: size_s, label: Small}
                - {id: size_m, label: Medium}
          fallback: auto
